id: toy-shop-discounts
title: Add discount codes to the shopping cart
split: dev # dev = for building the system; never used in a study
source:
  path: repo # local directory; for public repos use { git: <url>, commit: <sha> }
test_command: python -m pytest -q
hidden_tests: hidden_tests
notes: >
  Small self-contained task for developing the harness. Natural decomposition: explore money/cart,
  define the discount model + registry, integrate into Cart, handle edge cases, add tests.

prompt: |
  Add discount codes to the shopping cart in this repository.

  Requirements:
  1. Create `shop/discounts.py` with a frozen dataclass `Discount(kind, value, min_subtotal_cents=0)`,
     where `kind` is "percent" (value = whole percent, e.g. 10 means 10%) or "fixed" (value in cents),
     and a dict `DISCOUNT_CODES` containing exactly:
     - "SAVE10": 10% off
     - "FIVEOFF": $5.00 off
     - "BIG20": 20% off, only when the subtotal is at least $50.00
  2. Add `Cart.apply_code(code: str)`. Codes are case-insensitive. Unknown codes raise `ValueError`.
     A cart holds at most one code; applying a new code replaces the previous one.
     Applying a code whose minimum subtotal is not met raises `ValueError`.
  3. Add `Cart.discount_cents() -> int`, and make `Cart.total_cents()` subtract it.
     Percentage discounts round half up to the nearest cent. The discount never exceeds the subtotal.
     If items are removed so that the subtotal falls below the code's minimum, the discount becomes 0
     (the code stays applied).
  4. Add tests for the new behavior. Keep all existing tests passing.

variants:
  - id: omitted-requirement
    kind: prompt_override
    description: The minimum-subtotal re-check after removal (requirement 3, last sentence) is omitted.
    origin: task prompt (requirement 3)
    expected_affected: [shop/cart.py discount_cents, tests for BIG20]
