<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calm Tiles Panel</title>
<meta name="description" content="Clickable mockup (direction C, calm tiles): an observation panel for one coding agent that works in modules, plus the baseline log view.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ===================== 1. Tokens ===================== */
:root{
  color-scheme:dark;
  --bg:#0F172A;--tile:#141C2F;--card:#1B2336;--muted:#272F42;--primary:#1E293B;
  --line:rgba(148,163,184,.16);--line-2:rgba(148,163,184,.30);--line-strong:#475569;--sel-line:#64748B;--input-line:#64748B;--tile-line:rgba(148,163,184,.30);
  --fg:#F8FAFC;--fg-2:#CBD5E1;--fg-muted:#94A3B8;
  --bar-add:#22C55E;--bar-del:#EF4444;
  --ok:#22C55E;--ok-fg:#4ADE80;--ok-tint:rgba(34,197,94,.14);
  --warn:#F59E0B;--warn-fg:#FBBF24;--warn-tint:rgba(245,158,11,.14);--warn-line:rgba(245,158,11,.6);--warn-surface:#2A2617;--warn-solid:#F59E0B;--on-warn:#1C1403;
  --danger:#EF4444;--danger-fg:#F87171;--danger-tint:rgba(239,68,68,.13);--danger-line:rgba(248,113,113,.6);--danger-solid:#DC2626;--on-danger:#FFFFFF;
  --active:#60A5FA;--active-fg:#93C5FD;--active-tint:rgba(96,165,250,.14);
  --pending:#94A3B8;--pending-line:#64748B;
  --on-status:#0F172A;
  --ink:#F8FAFC;--on-ink:#0F172A;--ink-hover:#E2E8F0;
  --focus:#93C5FD;
  --act-read:#64748B;--act-edit:#A78BFA;--act-run:#CBD5E1;
  --code-bg:#0B1222;--diff-add:rgba(34,197,94,.13);--diff-del:rgba(239,68,68,.14);--diff-add-fg:#4ADE80;--diff-del-fg:#F87171;
  --tip-bg:#222B3E;--shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.35);
  --mock:#E879F9;--mock-bg:#1D1230;--mock-fg:#F5D0FE;--mock-on:#E879F9;--mock-on-fg:#1D1230;
  --font-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#F1F5F9;--tile:#F8FAFC;--card:#FFFFFF;--muted:#E2E8F0;--primary:#E2E8F0;
  --line:#E2E8F0;--line-2:#CBD5E1;--line-strong:#94A3B8;--sel-line:#7C8CA3;--input-line:#64748B;--tile-line:#CBD5E1;
  --fg:#0F172A;--fg-2:#334155;--fg-muted:#475569;
  --bar-add:#15803D;--bar-del:#DC2626;
  --ok:#16A34A;--ok-fg:#166534;--ok-tint:rgba(22,163,74,.10);
  --warn:#B45309;--warn-fg:#92400E;--warn-tint:rgba(180,83,9,.12);--warn-line:rgba(180,83,9,.6);--warn-surface:#FEF3C7;--warn-solid:#B45309;--on-warn:#FFFFFF;
  --danger:#DC2626;--danger-fg:#B91C1C;--danger-tint:rgba(220,38,38,.08);--danger-line:rgba(185,28,28,.55);--danger-solid:#DC2626;--on-danger:#FFFFFF;
  --active:#2563EB;--active-fg:#1D4ED8;--active-tint:rgba(37,99,235,.10);
  --pending:#64748B;--pending-line:#64748B;
  --on-status:#FFFFFF;
  --ink:#0F172A;--on-ink:#FFFFFF;--ink-hover:#1E293B;
  --focus:#1D4ED8;
  --act-read:#7C8CA3;--act-edit:#7C3AED;--act-run:#334155;
  --code-bg:#F8FAFC;--diff-add:rgba(22,163,74,.12);--diff-del:rgba(220,38,38,.10);--diff-add-fg:#166534;--diff-del-fg:#B91C1C;
  --tip-bg:#FFFFFF;--shadow:0 1px 2px rgba(15,23,42,.08),0 10px 28px rgba(15,23,42,.12);
  --mock:#A21CAF;--mock-bg:#FDF4FF;--mock-fg:#701A75;--mock-on:#A21CAF;--mock-on-fg:#FFFFFF;
}

/* ===================== 2. Base ===================== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
code,.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
code{font-size:12px}
.num{font-variant-numeric:tabular-nums}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.grow{flex:1 1 auto}
.ic,.g{display:block;flex:none}
.muted{color:var(--fg-muted)}
.nofill{fill:none}
.f-ok{fill:var(--ok)}.f-warn{fill:var(--warn)}.f-danger{fill:var(--danger)}.f-active{fill:var(--active)}.f-pending{fill:var(--pending)}
.s-ok{stroke:var(--ok)}.s-warn{stroke:var(--warn)}.s-danger{stroke:var(--danger)}.s-active{stroke:var(--active)}.s-pending{stroke:var(--pending)}.s-on{stroke:var(--on-status)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin .arc{transform-box:view-box;transform-origin:50% 50%;animation:spin 1.2s linear infinite}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ===================== 3. Controls ===================== */
.ib{width:36px;height:36px;display:inline-grid;place-items:center;flex:none;border-radius:8px;border:1px solid var(--line-2);background:transparent;color:var(--fg-2);transition:background-color .15s,border-color .15s,color .15s}
.ib:hover{background:var(--muted);color:var(--fg)}
.ib.sm{width:28px;height:28px;border-color:transparent}
.ib.danger{color:var(--danger-fg);border-color:var(--danger-line)}
.ib.danger:hover{background:var(--danger-tint)}
.ib[aria-disabled="true"],.btn[aria-disabled="true"]{opacity:.42;cursor:not-allowed}
.ib[aria-disabled="true"]:hover{background:transparent}
.tog{width:auto;min-width:36px;padding:0 9px;gap:6px;display:inline-flex;align-items:center;justify-content:center}
.tog[aria-pressed="true"]{background:var(--warn-tint);border-color:var(--warn-line);color:var(--warn-fg)}
.tog .tog-l{font-size:12px;font-weight:500;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--card);color:var(--fg);font-size:14px;font-weight:500;white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s}
.btn:hover{background:var(--muted)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;gap:6px}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.ink:hover{background:var(--ink-hover)}
.btn.warn{background:var(--warn-solid);border-color:var(--warn-solid);color:var(--on-warn)}
.btn.warn:hover{filter:brightness(1.06)}
.btn.danger-o{background:transparent;border-color:var(--danger-line);color:var(--danger-fg)}
.btn.danger-o:hover{background:var(--danger-tint)}
.btn.danger-solid{background:var(--danger-solid);border-color:var(--danger-solid);color:var(--on-danger)}
.btn.danger-solid:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg-2)}
.btn.ghost:hover{background:var(--muted);color:var(--fg)}
.btn.ghost.dz{color:var(--danger-fg)}
.btn.ghost.dz:hover{background:var(--danger-tint);color:var(--danger-fg)}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:6px;background:var(--muted);color:var(--fg-2);font-size:12px;border:1px solid transparent;white-space:nowrap}
button.chip{cursor:pointer;height:26px;padding:0 8px}
button.chip:hover{border-color:var(--line-2);color:var(--fg)}
.vdiv{width:1px;height:24px;background:var(--line-2);margin:0 4px;flex:none}
input[type=text],input[type=search],textarea{width:100%;border-radius:8px;border:1px solid var(--input-line);background:var(--bg);color:var(--fg);transition:border-color .15s}
input[type=text],input[type=search]{height:34px;padding:0 10px;font-size:14px}
textarea{padding:10px 12px;font-family:var(--font-mono);font-size:12px;line-height:1.55;resize:vertical;min-height:84px}
input::placeholder,textarea::placeholder{color:var(--fg-muted);opacity:1}
input:focus-visible,textarea:focus-visible{outline-offset:0;border-color:var(--focus)}

/* ===================== 4. Now bar ===================== */
.nowbar{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.nowbar.ph-waiting{background:var(--warn-surface);border-bottom:2px solid var(--warn)}
.nb{max-width:1360px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px;min-height:62px}
.nb-main{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.nb-title{margin:0;font-size:16px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nb-title .lead{color:var(--fg-muted);font-weight:500}
.nb-title .sep{color:var(--fg-muted);font-weight:400;margin:0 3px}
.nb-title .mono{font-weight:500}
.nb-act{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--active-tint);color:var(--active-fg);font-size:12px;flex:none}
.nb-prog{display:flex;align-items:center;gap:10px;flex:none}
.segs{display:inline-flex;align-items:center;gap:3px}
.seg{display:block}
.next{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--fg-muted)}
.next .mono{color:var(--fg);font-size:12px}
.nb-flag{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--danger-line);background:transparent;color:var(--danger-fg);font-size:14px;flex:none;transition:background-color .15s}
.nb-flag:hover{background:var(--danger-tint)}
.nb-ctrls{display:flex;align-items:center;gap:8px;flex:none}
/* decision card */
.dc{max-width:1360px;margin:0 auto;padding:12px 24px 14px;display:grid;gap:10px}
.dc-top{display:flex;align-items:center;gap:12px;min-width:0;flex-wrap:wrap}
.dc-title{margin:0;font-size:18px;font-weight:600;line-height:1.3;white-space:nowrap}
.dc-timer{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--warn-line);color:var(--warn-fg);font-family:var(--font-mono);font-size:14px;font-weight:500}
.dc-what{display:inline-flex;align-items:center;gap:8px;color:var(--fg-2);font-size:14px;min-width:0}
.dc-what .mono{color:var(--fg)}
.dc-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-left:34px}

/* ===================== 5. Plan tiles ===================== */
main{max-width:1360px;margin:0 auto;padding:16px 24px 96px}
.plan-head{display:flex;align-items:center;gap:8px;height:28px}
.ph-l{display:inline-flex;align-items:center;gap:6px;color:var(--fg-muted);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.ph-l .chip{letter-spacing:0;text-transform:none}
.tiles-wrap{position:relative;padding-top:26px}
.deps{position:absolute;left:0;top:0;width:100%;height:28px;overflow:visible;pointer-events:none}
.deps .dep{fill:none;stroke:var(--fg-muted);stroke-width:1.5;stroke-linecap:round}
.deps .dep-ah{fill:none;stroke:var(--fg-muted);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.deps .dep-dot{fill:var(--bg);stroke:var(--fg-muted);stroke-width:1.5}
.tiles{display:grid;grid-template-columns:104px repeat(4,minmax(0,1fr)) 28px;column-gap:16px}
.tile{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:112px;padding:12px;border:1px solid var(--tile-line);border-radius:10px;background:var(--tile);color:var(--fg);text-align:left;transition:border-color .15s,background-color .15s}
.tile:hover{border-color:var(--sel-line);background:var(--card)}
.tile.is-sel{background:var(--card);border-color:var(--sel-line);border-bottom-color:transparent;border-radius:10px 10px 0 0;z-index:3}
.tile.is-sel::after{content:"";position:absolute;left:-1px;right:-1px;top:100%;height:18px;background:var(--card);border-left:1px solid var(--sel-line);border-right:1px solid var(--sel-line)}
.tile.will-replace{border-style:dashed;border-color:var(--danger-line)}
.tile.will-replace.is-sel{border-bottom-color:transparent}
.t-top{display:flex;align-items:center;gap:6px;min-width:0;height:20px}
.t-id{font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--fg-muted)}
/* up/down chips only where the arcs are hidden (stacked layout) */
.t-rel{display:none;place-items:center;width:18px;height:18px;border-radius:5px;background:var(--muted);color:var(--fg)}
.t-flag{color:var(--danger-fg);display:inline-flex}
.t-ver{display:inline-flex;align-items:center;gap:2px;height:18px;padding:0 4px;border-radius:5px;background:var(--muted);color:var(--fg-2);font-family:var(--font-mono);font-size:12px}
.t-rep{display:inline-flex}
.t-ring{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--fg-2)}
.t-title{font-size:14px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st-pending .t-title{color:var(--fg-2)}
.t-ev{margin-top:auto;display:flex;align-items:center;gap:8px;min-width:0;height:18px;font-size:12px;color:var(--fg-muted)}
.t-ev .strip{flex:1 1 auto;min-width:24px}
.t-dep{display:inline-flex;align-items:center;gap:5px}
.t-dep .mono{color:var(--fg-2)}
.tile-pre{align-items:flex-start}
.pre-dots{display:flex;align-items:flex-end;gap:4px;height:16px}
.fdot{display:inline-flex}
.fdot .fd{fill:var(--act-read)}
.t-cap{margin-top:auto;font-size:12px;color:var(--fg-muted);line-height:1.25}
.tile-end{min-width:0}
/* pause / stop marker */
.pmark{position:absolute;z-index:5;pointer-events:none;left:0;top:26px;width:26px;height:112px;transition:left .25s ease,top .25s ease,width .25s ease,height .25s ease}
.pmark.snap{transition:none}
.pm-line{position:absolute;left:12px;top:0;bottom:0;width:2px;border-radius:1px}
.pm-badge{pointer-events:auto;position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:8px;display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg)}
.pmark.m-pause .pm-line{background:var(--warn)}
.pmark.m-pause .pm-badge{background:var(--warn-solid);color:var(--on-warn)}
.pmark.m-wait .pm-line{background:var(--warn)}
.pmark.m-wait .pm-badge{background:transparent;box-shadow:none}
.pmark.horiz .pm-line{left:0;right:0;top:12px;bottom:auto;width:auto;height:2px}

/* ===================== 6. Detail panel / module card ===================== */
.detail{position:relative;z-index:2;margin-top:16px;border:1px solid var(--sel-line);border-radius:10px;background:var(--card);min-height:300px}
.detail.sel-first{border-top-left-radius:0}
.card{padding:18px 20px 0}
.c-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:34px}
.c-id{font-family:var(--font-mono);font-size:14px;font-weight:500;color:var(--fg-muted)}
.c-title{margin:0;font-size:18px;font-weight:600;line-height:1.3}
.c-st{font-size:12px;font-weight:500;height:22px;display:inline-flex;align-items:center;padding:0 8px;border-radius:999px;background:var(--muted);color:var(--fg-2)}
.c-st.s-working{background:var(--active-tint);color:var(--active-fg)}
.c-st.s-verified{background:var(--ok-tint);color:var(--ok-fg)}
.c-st.s-unverified{background:var(--warn-tint);color:var(--warn-fg)}
.c-st.s-stopped{background:var(--danger-tint);color:var(--danger-fg)}
.c-meta{display:inline-flex;align-items:center;gap:6px;color:var(--fg-muted);font-size:12px;font-family:var(--font-mono)}
.c-goal{margin:6px 0 0 30px;color:var(--fg-2);font-size:14px}
.c-flag{display:flex;align-items:center;gap:8px;margin:12px 0 0 30px;padding:8px 8px 8px 12px;border-radius:8px;background:var(--danger-tint);border:1px solid transparent;font-size:14px;transition:border-color .2s}
.c-flag .ic{color:var(--danger-fg)}
.c-flag.flash{border-color:var(--danger-line)}
.c-body{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:24px;padding:18px 0 18px 30px}
.col{min-width:0;display:flex;flex-direction:column;gap:16px}
.sec-h{display:flex;align-items:center;gap:6px;margin:0 0 6px;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-muted)}
.crits{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.crit{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:14px;line-height:1.35}
.crit .g,.crit .ic{margin-top:1px}
.crit-src{width:14px;flex:none;color:var(--fg-muted)}
.frow,.trow{display:flex;align-items:center;gap:8px;width:calc(100% + 16px);min-height:32px;margin:0 -8px;padding:4px 8px;border:1px solid transparent;border-radius:6px;background:transparent;text-align:left;font-size:12px;color:var(--fg);transition:background-color .15s}
.frow:hover,.trow:hover{background:var(--muted)}
.fpath{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.none{color:var(--fg-muted);font-family:var(--font-mono);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.lchip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:6px;border:1px solid var(--line-2);background:transparent;font-size:12px;color:var(--fg-2);transition:background-color .15s}
.lchip:hover{background:var(--muted);color:var(--fg)}
.instr-txt{margin:0;color:var(--fg-2);font-size:14px}
.c-foot{display:flex;align-items:center;gap:10px;margin:0 -20px;padding:8px 14px;border-top:1px solid var(--line)}
.ev-counts{display:inline-flex;align-items:center;gap:8px;margin-left:4px;color:var(--fg-muted);font-size:12px;font-family:var(--font-mono)}
.ev-counts span{display:inline-flex;align-items:center;gap:3px}
.chain{display:inline-flex;align-items:center;gap:4px}
.chain .lnk-l{width:10px;height:1px;background:var(--line-strong)}
.chain .mono{font-size:12px;color:var(--fg-2);margin-left:2px}
/* glyph wrappers */
.gw{display:inline-flex}
/* diff bar */
.dstat{display:inline-flex;align-items:center;gap:6px;flex:none}
.dbar{display:inline-flex;height:6px;border-radius:3px;background:var(--muted);overflow:hidden;flex:none}
.dbar i{display:block;height:100%}
.dbar .da{background:var(--bar-add)}
.dbar .dd{background:var(--bar-del)}
.dnum{display:inline-flex;gap:4px;font-family:var(--font-mono);font-size:12px}
.dnum .a{color:var(--ok-fg)}
.dnum .d{color:var(--danger-fg)}
/* ring + pips */
.ring circle{fill:none;stroke-width:2.5}
.ring .r-track{stroke:var(--muted)}
.ring .r-ok{stroke:var(--ok)}
.ring .r-bad{stroke:var(--danger)}
.ring .r-empty{stroke:var(--pending-line);stroke-width:1.5;stroke-dasharray:2 2.4}
.ring .r-v{fill:none;stroke:var(--ok-fg);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ring .r-x{fill:none;stroke:var(--danger-fg);stroke-width:1.6;stroke-linecap:round}
.pips{display:inline-flex;align-items:center;gap:3px;flex-wrap:wrap}
.pip{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.pip.bad{position:relative;background:none;border-radius:0}
.pip.bad::before,.pip.bad::after{content:"";position:absolute;left:3px;top:-1px;width:2px;height:10px;border-radius:1px;background:var(--danger);transform:rotate(45deg)}
.pip.bad::after{transform:rotate(-45deg)}
/* activity strip */
.strip{position:relative;display:inline-block;height:16px;border-bottom:1px solid var(--line-2);flex:none}
.tk{position:absolute;bottom:0;width:3px;margin-left:-1.5px;border-radius:1.5px 1.5px 0 0}
.tk-read{height:6px;background:var(--act-read)}
.tk-run{height:10px;background:var(--act-run)}
.tk-edit{height:14px;background:var(--act-edit)}
.tk-ok,.tk-bad{height:11px}
.tk-ok{background:var(--ok)}.tk-bad{background:var(--danger)}

A tiny shopping-cart library used as a development task for the module-oversight project.

- \`shop/money.py\`: money helpers. **All amounts are integer cents.**
- \`shop/catalog.py\`: products.
- \`shop/cart.py\`: the cart.

from shop.catalog import Product
from shop.money import format_cents


@dataclass
class LineItem:
    product: Product
    quantity: int

    @property
    def total_cents(self) -> int:
        return self.product.price_cents * self.quantity


@dataclass
class Cart:
    items: dict[str, LineItem] = field(default_factory=dict)

    def add(self, product: Product, quantity: int = 1) -> None:
        if quantity <= 0:
            raise ValueError("quantity must be positive")
        if product.sku in self.items:
            self.items[product.sku].quantity += quantity
        else:
            self.items[product.sku] = LineItem(product, quantity)

    def remove(self, sku: str, quantity: int | None = None) -> None:
        """Remove @BT@quantity@BT@ units of @BT@sku@BT@, or the whole line when quantity is None."""
        item = self.items.get(sku)
        if item is None:
            raise KeyError(sku)
        if quantity is None or quantity >= item.quantity:
            del self.items[sku]
        else:
            item.quantity -= quantity

    def subtotal_cents(self) -> int:
        return sum(item.total_cents for item in self.items.values())

    def total_cents(self) -> int:
        return self.subtotal_cents()

    def summary(self) -> str:
        lines = [f"{i.quantity} x {i.product.name}: {format_cents(i.total_cents)}" for i in self.items.values()]
        lines.append(f"Total: {format_cents(self.total_cents())}")
        return "\n".join(lines)`.replace(/@BT@/g, '`');

def parse_dollars(text: str) -> int:
    """Parse a dollar string such as "19.99" or "$5" into cents."""
    cleaned = text.strip().lstrip("$")
    if "." in cleaned:
        whole, frac = cleaned.split(".", 1)
        frac = (frac + "00")[:2]
    else:
        whole, frac = cleaned, "00"
    return int(whole or "0") * 100 + int(frac)


def format_cents(cents: int) -> str:
    """Format cents as a dollar string, e.g. 1999 -> "$19.99"."""
    sign = "-" if cents < 0 else ""
    cents = abs(cents)
    return f"{sign}\${cents // 100}.{cents % 100:02d}"`;

    if (!list.length) rows = '<p class="ev-empty">' + icon('clock', 14) + 'No actions yet</p>';
    let extra = '';
    if (sel !== 'PRE') {
      const iv = instrVersions(sel);
      extra += '<div class="ev-h">Instructions</div><button class="ev-row' + (cur === 'iv' ? ' is-on' : '') + '" data-act="ev-item" data-k="iv" data-fk="ev-iv" aria-pressed="' + (cur === 'iv') + '" aria-label="Instruction versions: ' + iv.length + '"><span class="ev-ic">' + icon('history', 16) + '</span><span class="ev-obj">' + iv.map(function (v) { return '<span class="vchip">' + icon(v.by === 'you' ? 'user' : 'bot', 12) + 'v' + v.v + '</span>'; }).join('') + '</span></button>';
      const reps = ui.ov.replaced[sel] || [];
      if (reps.length) extra += '<div class="ev-h">Earlier attempts</div>' + reps.map(function (a) { const k = 'att-' + a.n; return '<button class="ev-row' + (cur === k ? ' is-on' : '') + '" data-act="ev-item" data-k="' + k + '" data-fk="ev-' + k + '" aria-pressed="' + (cur === k) + '"><span class="ev-ic">' + glyph('replaced', 16) + '</span><span class="ev-obj">Attempt ' + a.n + '</span><span class="ev-badge muted">replaced</span></button>'; }).join('');
    }
    return '<section class="ev" id="evidence" aria-label="Evidence"><div class="ev-list"><div class="ev-h">Actions</div>' + rows + extra + '</div><div class="ev-view">' + viewerHtml(m, sel, cur, list) + '</div></section>';
  }
  function diffHtml(text) {
    return text.split('\n').map(function (l) {
      const c = l.charAt(0);
      const cls = c === '+' ? 'add' : c === '-' ? 'del' : c === '@' ? 'hunk' : 'ctx';
      const sign = cls === 'add' ? '+' : cls === 'del' ? MINUS : '';
      const body = cls === 'hunk' ? l : l.slice(1);
      return '<span class="dl ' + cls + '"><span class="dg" aria-hidden="true">' + sign + '</span>' + (cls === 'add' ? '<span class="sr">added: </span>' : cls === 'del' ? '<span class="sr">removed: </span>' : '') + '<span class="dcode">' + (esc(body) || ' ') + '</span></span>';
    }).join('');
  }
  function fileHtml(text) {
    return text.split('\n').map(function (l, i) { return '<span class="fl"><span class="ln" aria-hidden="true">' + (i + 1) + '</span><span class="lc">' + (esc(l) || ' ') + '</span></span>'; }).join('');
  }
  function outHtml(text) {
    return text.split('\n').map(function (l) {
      const cls = /^\$ /.test(l) ? 'cmd' : (/^(E |FAILED|>)/.test(l) || /\bfailed\b/.test(l)) ? 'bad' : /\bpassed\b/.test(l) ? 'good' : '';
      return '<span class="ol ' + cls + '"><span class="oc">' + (esc(l) || ' ') + '</span></span>';
    }).join('');
  }
  function codeBlock(dt) {
    if (dt.kind === 'diff') return '<pre class="code" aria-label="Diff">' + diffHtml(dt.text) + '</pre>';
    if (dt.kind === 'file') return '<pre class="code" aria-label="File excerpt">' + fileHtml(dt.text) + '</pre>';
    return '<pre class="code" aria-label="Output">' + outHtml(dt.text) + '</pre>';
  }
  function finishBody(e) {
    const md = MOD[e.mod], cs = critState(e.verdict);
    let h = '<ul class="fin-crit">' + md.criteria.map(function (c) { return '<li>' + glyph(cs.g, 14) + (cs.src ? icon(cs.src, 14, 'muted') : '') + '<span>' + esc(c) + '</span><span class="sr">' + esc(cs.tip) + '</span></li>'; }).join('') + '</ul>';
    if (e.flag) h += '<div class="c-flag" style="margin-left:0">' + icon('flag', 16) + '<span>' + esc(e.flag) + '</span></div>';
    return h;
  }
  function bodyFor(e) {
    if (e.type === 'finish') return finishBody(e) + (e.detail ? codeBlock(e.detail) : '');
    if (e.type === 'start') { const iv = instrVersions(e.mod); const v = iv[Math.min(iv.length, e.attempt || 1) - 1] || iv[0]; return '<p class="ev-note">' + icon(v.by === 'you' ? 'user' : 'bot', 14, 'muted') + ' ' + esc(v.text) + '</p>'; }
    if (e.detail) return codeBlock(e.detail);
    if (e.type === 'redo' && e.note) return '<p class="ev-note">' + esc(e.note) + '</p>';
    if (e.text && (e.type === 'note' || e.type === 'correct')) return '<p class="ev-note">' + esc(e.text) + '</p>';
    return '';
  }
  function viewerHtml(m, sel, cur, list) {
    if (cur === 'iv') {
      const iv = instrVersions(sel).slice().reverse();
      return '<div class="ev-vh">' + icon('history', 16) + '<span class="ev-vt">Instructions · ' + sel + '</span></div><div class="ivs">' + iv.map(function (v, i) {
        return '<div class="iv' + (i === 0 ? ' cur' : '') + '"><div class="iv-h">' + icon(v.by === 'you' ? 'user' : 'bot', 14) + '<span class="mono">v' + v.v + '</span><span>' + (v.by === 'you' ? 'by you' : 'by agent') + (v.kind === 'correction' ? ' · correction' : '') + '</span><span class="grow"></span><span class="mono">' + fmt(v.t) + '</span></div><p>' + esc(v.text) + '</p>' + (v.note ? '<p class="ivn">' + icon('note', 12) + ' ' + esc(v.note) + '</p>' : '') + '</div>';
      }).join('') + '</div>';
    }
    if (cur.indexOf('att-') === 0) {
      const n = +cur.slice(4), a = (ui.ov.replaced[sel] || []).filter(function (x) { return x.n === n; })[0];
      if (!a) return '';
      return '<div class="ev-vh">' + glyph('replaced', 16) + '<span class="ev-vt">' + sel + ' attempt ' + n + ' · replaced</span></div><div class="ivs">' + a.events.filter(function (e) { return ACT_TYPES.has(e.type) || e.type === 'finish'; }).map(function (e) { return '<div class="ev-vh">' + evIcon(e, 14) + '<span class="ev-vt">' + evLabel(e) + '</span>' + evBadge(e) + '</div>'; }).join('') + '</div>';
    }
    const e = list.filter(function (x) { return x.key === cur; })[0] || m.evs.filter(function (x) { return x.key === cur; })[0];
    if (!e) return '';
    return '<div class="ev-vh">' + evIcon(e, 16) + '<span class="ev-vt">' + evLabel(e) + '</span>' + evBadge(e) + '<span class="grow"></span><span class="mono muted">' + fmt(e.t) + '</span></div>' + bodyFor(e);
  }

  /* ---------- flows: redo / change / correct (inline, never full-screen) ---------- */
  function flowHtml(m, f) {
    if (f.kind === 'redo') return redoHtml(m, f);
    if (f.kind === 'change') return changeHtml(m, f);
    return correctHtml(m, f);
  }
  // Drafts outlive the panel: closing (Esc, another tile, a re-render) never loses typed text.
  function draftKey(f) { return f.kind + ':' + f.mod; }
  function draft(f) { return ui.drafts[draftKey(f)] || {}; }
  function closeBtn(label) { return '<button type="button" class="ib sm" data-act="flow-cancel" data-fk="flow-x" aria-label="' + label + '" data-tip="Close (Esc)">' + icon('x', 16) + '</button>'; }
  function redoHtml(m, f) {
    const k = f.mod, ci = IDX[k];
    const iv = instrVersions(k), cur = iv[iv.length - 1];
    const running = m.phase === 'working';
    const affected = MODS.filter(function (x) { return IDX[x.id] >= ci; });
    const kept = MODS.filter(function (x) { return IDX[x.id] < ci; });
    const files = [];
    affected.forEach(function (x) { modData(m, x.id).files.forEach(function (fl) { if (files.indexOf(fl.path) < 0) files.push(fl.path); }); });
    const replaced = affected.filter(function (x) { return m.st[x.id] !== 'pending'; });
    // conversation timeline
    const segsArr = [{ id: 'PRE', dur: preData(m).dur, cut: false }].concat(MODS.map(function (x) { const d = modData(m, x.id); return { id: x.id, dur: d.dur || 0, cut: IDX[x.id] >= ci }; })).filter(function (s) { return s.dur > 0; });
    const total = segsArr.reduce(function (n, s) { return n + s.dur; }, 0) || 1;
    let acc = 0, cutAt = 100;
    segsArr.forEach(function (s) { if (s.id === k) cutAt = acc / total * 100; acc += s.dur; });
    const tl = '<span class="tl" role="img" aria-label="Conversation rewinds to before ' + k + '">' + segsArr.map(function (s) { return '<span class="ts' + (s.id === 'PRE' ? ' pre' : '') + (s.cut ? ' cut' : '') + '" style="flex:' + s.dur + ' 1 0"></span>'; }).join('') + '<span class="tcut" style="left:calc(' + cutAt.toFixed(1) + '% - 1px)">' + icon('scissors', 14) + '</span></span>' +
      '<span class="tl-lab" aria-hidden="true">' + segsArr.map(function (s) { return '<span style="flex:' + s.dur + ' 1 0">' + (s.id === 'PRE' ? '' : s.id) + '</span>'; }).join('') + '</span>';
    const fileChips = files.length ? files.map(function (p) { return '<span class="cchip file"><span class="rb">' + icon('restore', 12) + '</span>' + icon('file', 12) + '<span class="mono">' + esc(p) + '</span></span>'; }).join('') : '<span class="none">—</span>';
    const repChips = replaced.length ? replaced.map(function (x) { return '<span class="cchip struck">' + glyph('replaced', 12) + '<span class="lbl">' + x.id + ' attempt ' + attemptNo(x.id) + '</span></span>'; }).join('') : '<span class="none">—</span>';
    const keptChips = kept.length ? kept.map(function (x) { return '<span class="cchip">' + glyph(m.st[x.id], 12) + '<span class="mono">' + x.id + '</span></span>'; }).join('') : '<span class="none">—</span>';
    const agent = running ? '<span class="cchip dz">' + icon('stop', 12) + 'stopped now</span>' : '<span class="cchip">' + icon('stopOff', 12) + 'idle<span class="sr">, nothing to stop</span></span>';
    const dr = draft(f);
    return '<form class="flow redo" data-form="redo" data-mod="' + k + '" aria-labelledby="flowTitle">' +
      '<div class="flow-h">' + icon('restore', 18) + '<h3 id="flowTitle">Redo from ' + k + '</h3><span class="grow"></span>' + closeBtn('Close redo panel') + '</div>' +
      '<div class="flow-grid"><div class="flow-edit">' +
        '<label class="fl-l" for="flowInstr">Instructions for ' + k + ' <span class="chip">v' + iv.length + ' → v' + (iv.length + 1) + '</span></label>' +
        '<textarea id="flowInstr" rows="4" data-fk="flow-instr">' + esc(dr.instr != null ? dr.instr : cur.text) + '</textarea>' +
        '<label class="fl-l" for="flowNote">What went wrong <span class="opt">optional</span></label>' +
        '<input id="flowNote" type="text" autocomplete="off" data-fk="flow-note" value="' + esc(dr.note || '') + '">' +
      '</div><div class="cq-list" role="group" aria-label="What will happen">' +
        '<div class="cq"><span class="cq-k">' + icon('restore', 14) + 'Restore</span><span class="cq-v">' + fileChips + '</span></div>' +
        '<div class="cq"><span class="cq-k">' + icon('scissors', 14) + 'Rewind</span><span class="cq-v" style="display:block">' + tl + '</span></div>' +
        '<div class="cq"><span class="cq-k">' + icon('swap', 14) + 'Replace</span><span class="cq-v">' + repChips + '</span></div>' +
        '<div class="cq"><span class="cq-k">' + icon('check', 14) + 'Keep</span><span class="cq-v">' + keptChips + '</span></div>' +
        '<div class="cq"><span class="cq-k">' + icon('bot', 14) + 'Agent</span><span class="cq-v">' + agent + '</span></div>' +
      '</div></div>' +
      '<div class="flow-actions"><button type="button" class="btn" data-act="flow-cancel" data-fk="flow-cancel">Cancel</button><button type="submit" class="btn danger-solid" data-fk="flow-go">' + icon(running ? 'stop' : 'restore', 16) + (running ? 'Stop &amp; redo from ' : 'Redo from ') + k + '</button></div></form>';
  }
  function changeHtml(m, f) {
    const k = f.mod, iv = instrVersions(k), cur = iv[iv.length - 1], dr = draft(f);
    return '<form class="flow" data-form="change" data-mod="' + k + '" aria-labelledby="flowTitle">' +
      '<div class="flow-h">' + icon('pencil', 18) + '<h3 id="flowTitle">Change ' + k + '</h3><span class="chip mono">v' + iv.length + ' → v' + (iv.length + 1) + '</span><span class="grow"></span>' + closeBtn('Close change panel') + '</div>' +
      '<label class="fl-l" for="flowInstr">Instructions</label><textarea id="flowInstr" rows="3" data-fk="flow-instr">' + esc(dr.instr != null ? dr.instr : cur.text) + '</textarea>' +
      '<p class="hint">' + icon('clock', 14) + 'Used when ' + k + ' starts</p>' +
      '<div class="flow-actions"><button type="button" class="btn" data-act="flow-cancel" data-fk="flow-cancel">Cancel</button><button type="submit" class="btn ink" data-fk="flow-go">' + icon('check', 16) + 'Save v' + (iv.length + 1) + '</button></div></form>';
  }
  function correctHtml(m, f) {
    const k = f.mod, obj = m.current ? m.current.obj : 'its current step', dr = draft(f);
    return '<form class="flow" data-form="correct" data-mod="' + k + '" aria-labelledby="flowTitle">' +
      '<div class="flow-h">' + icon('note', 18) + '<h3 id="flowTitle">Correct ' + k + '</h3><span class="grow"></span>' + closeBtn('Close correction panel') + '</div>' +
      '<label class="fl-l" for="flowCorrect">' + icon('clock', 14) + 'Reaches the agent after <code>' + esc(obj) + '</code></label>' +
      '<div class="row" style="margin-top:6px"><input id="flowCorrect" type="text" autocomplete="off" data-fk="flow-correct" placeholder="What should change?" value="' + esc(dr.correct || '') + '"><button type="submit" class="btn ink" data-fk="flow-go">' + icon('send', 16) + 'Send</button></div></form>';
  }

  /* =====================================================================
     8. RENDER: LOG VIEW (baseline condition)
     ===================================================================== */
  function typeGroup(e) {
    if (e.type === 'read') return 'read';
    if (e.type === 'edit' || e.type === 'write') return 'edit';
    if (e.type === 'bash' || e.type === 'test') return 'run';
    if (YOU_TYPES.has(e.type) || e.type === 'resume') return 'you';
    return 'module';
  }
  function plain(html) { return html.replace(/<[^>]+>/g, '').replace(/&[a-z#0-9]+;/g, ' '); }
  function passFilters(e) {
    const L = ui.log;
    if (L.mod !== 'all' && e.mod !== L.mod) return false;
    if (!L.types.has(typeGroup(e))) return false;
    if (L.flagged && !e.flag) return false;
    if (L.q) {
      const hay = (plain(evLabel(e)) + ' ' + (e.obj || '') + ' ' + (e.mod || '') + ' ' + (MOD[e.mod] ? MOD[e.mod].title : '')).toLowerCase();
      if (hay.indexOf(L.q.toLowerCase()) < 0) return false;
    }
    return true;
  }
  function currentStart(m, mod) { const d = modData(m, mod); return d.start; }
  function flowAnchor(m) {
    const f = ui.flow;
    if (!f) return null;
    if (f.anchor) return f.anchor;
    if (f.kind === 'change') { const p = m.evs.filter(function (e) { return e.type === 'plan'; })[0]; return p ? p.key : null; }
    const s = currentStart(m, f.mod);
    return s ? s.key : null;
  }
  function rowActions(m, e) {
    if (e.type === 'plan') {
      return MODS.filter(function (x) { return m.st[x.id] === 'pending'; }).map(function (x) { return '<button class="btn sm ghost" data-act="flow-open" data-kind="change" data-mod="' + x.id + '" data-anchor="' + e.key + '" data-fk="ra-' + e.key + '-' + x.id + '">' + icon('pencil', 14) + 'Change ' + x.id + '…</button>'; }).join('');
    }
    if ((e.type === 'start' || e.type === 'finish') && MOD[e.mod]) {
      const s = currentStart(m, e.mod);
      if (!s || e.t < s.t) return '';
      const st = m.st[e.mod];
      if (FINISHED.has(st)) return '<button class="btn sm ghost dz" data-act="flow-open" data-kind="redo" data-mod="' + e.mod + '" data-anchor="' + e.key + '" data-fk="ra-' + e.key + '">' + icon('restore', 14) + 'Redo from ' + e.mod + '…</button>';
      if (st === 'working' && e.type === 'start') return '<button class="btn sm ghost" data-act="flow-open" data-kind="correct" data-mod="' + e.mod + '" data-anchor="' + e.key + '" data-fk="ra-' + e.key + '">' + icon('note', 14) + 'Correct ' + e.mod + '…</button>';
    }
    return '';
  }
  function evArgs(m, e) {
    switch (e.type) {
      case 'read': return { tool: 'read', path: e.obj };
      case 'write': return { tool: 'write', path: e.obj, lines: '+' + e.add };
      case 'edit': return { tool: 'edit', path: e.obj, lines: '+' + e.add + ' ' + MINUS + e.del };
      case 'bash': return { tool: 'bash', command: e.obj };
      case 'test': return { tool: 'bash', command: e.cmd, result: e.tests.pass + ' passed, ' + e.tests.fail + ' failed' };
      case 'plan': return { version: 'v1 (agent)', modules: MODS.map(function (x) { return x.id; }).join(', ') };
      case 'start': return { module: e.mod + ' · ' + MOD[e.mod].title, needs: MOD[e.mod].deps.join(', ') || '—', attempt: String(e.attempt || 1) };
      case 'finish': return { module: e.mod, verdict: e.verdict === 'verified' ? 'verified (passing test after last edit)' : 'done, unverified (agent says criteria met)', tests: e.tests ? e.tests.pass + '/' + (e.tests.pass + e.tests.fail) : 'no passing run after last edit' };
      case 'wait': return { reason: 'pause at next stop', held: 'before M' + (IDX[e.mod] + 1) };
      case 'run': return { task: D.task, agent: 'pi coding agent' };
      case 'end': return { modules: '4 of 4 done', flags: String(m.flags.length) };
      default: return { by: YOU_TYPES.has(e.type) || e.type === 'resume' ? 'you' : 'agent' };
    }
  }
  function logRow(m, e, anchor, cutFrom) {
    const open = ui.log.open.has(e.key);
    const acts = rowActions(m, e);
    const tag = e.mod === 'PRE' ? 'pre' : (e.mod || 'run');
    const willCut = cutFrom && e.mod && IDX[e.mod] >= IDX[cutFrom] && e.type !== 'redo';
    const args = evArgs(m, e);
    return '<li class="lrow' + (e.flag ? ' flagged' : '') + (open ? ' open' : '') + (willCut ? ' will-cut' : '') + '"><div class="lrow-line">' +
      '<button class="lrow-main" data-act="lrow" data-k="' + e.key + '" data-fk="lrow-' + e.key + '" aria-expanded="' + open + '"' + (open ? ' aria-controls="ld-' + e.key + '"' : '') + '>' +
        '<span class="ltime">' + fmt(e.t) + '</span><span class="ltag">' + tag + '</span><span class="licon">' + evIcon(e, 16) + '</span>' +
        '<span class="lsum">' + evLabel(e) + (e.flag ? ' <span class="sr">flagged: ' + esc(e.flag) + '</span>' : '') + '</span>' +
        '<span class="lbadge">' + evBadge(e) + '</span><span class="lchev">' + icon(open ? 'chevUp' : 'chevDown', 14) + '</span></button>' +
      '<span class="lacts">' + acts + '</span></div>' +
      (open ? '<div class="ldetail" id="ld-' + e.key + '"><dl class="args">' + Object.keys(args).map(function (k) { return '<dt>' + k + '</dt><dd>' + esc(args[k]) + '</dd>'; }).join('') + '</dl>' + (e.flag ? '<div class="c-flag" style="margin-left:0">' + icon('flag', 16) + '<span>' + esc(e.flag) + '</span></div>' : '') + bodyFor(e) + '</div>' : '') +
      (anchor === e.key ? '<div class="lflow">' + flowHtml(m, ui.flow) + '</div>' : '') + '</li>';
  }
  function renderLog(m) {
    const L = ui.log;
    const mods = ['all', 'PRE'].concat(MODS.map(function (x) { return x.id; }));
    const types = [['read', 'book', 'read'], ['edit', 'pencil', 'edit'], ['run', 'terminal', 'run'], ['module', 'playCircle', 'module'], ['you', 'user', 'you']];
    $('#logView').innerHTML = '<div class="log-tools">' +
      '<div class="search">' + icon('search', 16) + '<input id="logSearch" type="search" placeholder="Search" aria-label="Search events" data-fk="log-q" value="' + esc(L.q) + '" autocomplete="off"></div>' +
      '<div class="fgroup" role="group" aria-label="Module">' + mods.map(function (v) { return '<button class="fchip" data-act="log-mod" data-v="' + v + '" data-fk="lm-' + v + '" aria-pressed="' + (L.mod === v) + '">' + (v === 'all' ? 'All' : v === 'PRE' ? 'pre' : v) + '</button>'; }).join('') + '</div>' +
      '<div class="fgroup" role="group" aria-label="Event type">' + types.map(function (t) { return '<button class="fchip" data-act="log-type" data-v="' + t[0] + '" data-fk="lt-' + t[0] + '" aria-pressed="' + L.types.has(t[0]) + '">' + icon(t[1], 14) + t[2] + '</button>'; }).join('') + '</div>' +
      '<button class="fchip flagc" data-act="log-flag" data-fk="lf" aria-pressed="' + L.flagged + '">' + icon('flag', 14) + 'flagged</button>' +
      '<span class="grow"></span><span class="log-count" id="logCount" aria-live="polite"></span></div><ol class="log-list" id="logList" aria-label="Events, oldest first"></ol>';
    renderLogList(m);
  }
  function renderLogList(m) {
    m = m || model();
    const rows = m.evs.filter(passFilters);
    const anchor = flowAnchor(m);
    const cutFrom = ui.flow && ui.flow.kind === 'redo' ? ui.flow.mod : null;
    $('#logList').innerHTML = rows.length ? rows.map(function (e) { return logRow(m, e, anchor, cutFrom); }).join('') : '<li class="log-empty">No matching events</li>';
    $('#logCount').textContent = rows.length + ' / ' + m.evs.length;
  }

  /* =====================================================================
     9. RENDER: MOCKUP CHROME + POPOVERS + ORCHESTRATION
     ===================================================================== */
  function renderMock() {
    const keys = Object.keys(D.states);
    $('#mock').innerHTML = '<span class="mock-tag">' + icon('tiles', 14) + 'Mockup</span>' +
      '<span class="mock-g" role="group" aria-label="Mock state">' + keys.map(function (k) { const s = D.states[k]; return '<button data-act="state" data-v="' + k + '" data-fk="mock-' + k + '" aria-pressed="' + (ui.state === k) + '"><span class="mk-n">' + s.n + '</span>' + s.label + (ui.state === k && ui.ov.dirty ? ' *' : '') + '</button>'; }).join('') + '</span>' +
      '<span class="mock-sep" aria-hidden="true"></span>' +
      '<span class="mock-g" role="group" aria-label="View"><button data-act="view" data-v="modules" data-fk="mock-modules" aria-pressed="' + (ui.view === 'modules') + '">' + icon('tiles', 14) + 'Modules</button><button data-act="view" data-v="log" data-fk="mock-log" aria-pressed="' + (ui.view === 'log') + '">' + icon('list', 14) + 'Log</button></span>' +
      '<span class="mock-sep" aria-hidden="true"></span>' +
      '<span class="mock-g" role="group" aria-label="Theme"><button data-act="theme" data-v="dark" data-fk="mock-dark" aria-pressed="' + (ui.theme === 'dark') + '">' + icon('moon', 14) + 'dark</button><button data-act="theme" data-v="light" data-fk="mock-light" aria-pressed="' + (ui.theme === 'light') + '">' + icon('sun', 14) + 'light</button></span>';
  }
  function renderPop() {
    const p = $('#pop');
    if (!ui.pop) { p.hidden = true; p.innerHTML = ''; p.removeAttribute('role'); p.removeAttribute('aria-label'); p.removeAttribute('aria-labelledby'); p.removeAttribute('aria-describedby'); p.removeAttribute('aria-modal'); return; }
    const m = model();
    if (ui.pop.kind === 'note') {
      const when = m.current ? 'Reaches the agent after <code>' + esc(m.current.obj) + '</code>' : 'Reaches the agent at its next step';
      p.setAttribute('role', 'dialog'); p.setAttribute('aria-label', 'Note to agent'); p.removeAttribute('aria-labelledby'); p.removeAttribute('aria-describedby');
      p.innerHTML = '<form data-form="note"><label class="pop-l" for="noteInput">' + icon('clock', 14) + when + '</label><div class="row"><input id="noteInput" type="text" autocomplete="off" data-fk="note-input" placeholder="Note to agent" value="' + esc(ui.noteDraft) + '"><button type="submit" class="btn ink" data-fk="note-send">' + icon('send', 16) + 'Send</button></div></form>';
      p.removeAttribute('aria-modal');
    } else if (ui.pop.kind === 'legend') {
      p.setAttribute('role', 'dialog'); p.setAttribute('aria-label', 'Legend and keys'); p.removeAttribute('aria-labelledby'); p.removeAttribute('aria-describedby'); p.removeAttribute('aria-modal');
      p.innerHTML = '<div class="pop-lg"><button type="button" class="ib sm pop-x" data-act="pop-close" data-fk="legend-x" aria-label="Close legend">' + icon('x', 16) + '</button>' + legendShapes() + LEGEND_ACT + LEGEND_KEYS + '</div>';
    } else {
      p.setAttribute('role', 'alertdialog'); p.setAttribute('aria-modal', 'true'); p.removeAttribute('aria-label'); p.setAttribute('aria-labelledby', 'stopTitle'); p.setAttribute('aria-describedby', 'stopDesc');
      p.innerHTML = '<p class="pop-t" id="stopTitle">Stop the agent?</p><p class="pop-d" id="stopDesc">Code is kept.</p><div class="row end"><button class="btn" data-act="pop-close" data-fk="stop-cancel">Cancel</button><button class="btn danger-solid" data-act="stop-confirm" data-fk="stop-go">' + icon('stop', 16) + 'Stop agent</button></div>';
    }
    p.hidden = false;
    placePop();
  }
  // Close the popover without a full re-render; optionally hand focus back to its trigger.
  function closePop(focusBack) {
    const fk = ui.pop && ui.pop.fk;
    ui.pop = null; renderPop();
    $$('[aria-controls="pop"][aria-expanded="true"]').forEach(function (b) { b.setAttribute('aria-expanded', 'false'); });

      return el.tabIndex >= 0 && !el.disabled && el.getClientRects().length > 0;
    });
  }
  function focusAfter(fk) {
    const trig = fk && $('[data-fk="' + fk + '"]');

    const i = all.indexOf(trig);
    (all[i + 1] || trig).focus();
  }
  function placePop() {
    if (!ui.pop) return;
    const a = $('[data-fk="' + ui.pop.fk + '"]'), p = $('#pop');
    if (!a) return;
    const r = a.getBoundingClientRect(), w = p.offsetWidth;
    p.style.left = Math.max(12, Math.min(window.innerWidth - w - 12, r.right - w)) + 'px';
    p.style.top = (r.bottom + 8) + 'px';
  }
  function focusFk(fk, keep) { const n = fk && $('[data-fk="' + fk + '"]'); if (n) n.focus({ preventScroll: !!keep }); return !!n; }
  function render() {
    const act = document.activeElement;
    const fk = act && act.dataset ? act.dataset.fk : null;
    hideTip();
    document.documentElement.setAttribute('data-theme', ui.theme);
    const m = model();
    renderNow(m);
    const mv = ui.view === 'modules';
    $('#modulesView').hidden = !mv;
    $('#logView').hidden = mv;
    if (mv) { $('#logView').innerHTML = ''; renderPlan(m); renderDetail(m); layoutPlan(m); }
    else { $('#tiles').innerHTML = ''; $('#planHead').innerHTML = ''; $('#detail').innerHTML = ''; $('#detail').removeAttribute('aria-labelledby'); $('#detail').setAttribute('aria-label', 'Module detail'); $('#deps').innerHTML = ''; $('#pmark').hidden = true; renderLog(m); }
    renderMock();

    renderPop();

  }
  // Keep content and the toast clear of the floating mockup pill (it wraps on narrow screens).
  function fitChrome() {
    const h = $('#mock').offsetHeight;
    $('#main').style.paddingBottom = (h + 40) + 'px';
    $('#toast').style.bottom = (h + 24) + 'px';
  }

  /* =====================================================================
     10. ACTIONS
     ===================================================================== */
  let toastTimer = null;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2800); }
  function userEvent(o) { ui.uid++; return Object.assign({ key: 'u' + ui.uid, seq: 1000 + ui.uid }, o); }
  function nowT(m) { return m.now + ui.tick; }

  function setState(k) {
    const S = D.states[k], B = D.states[S.base || k];
    ui.state = k; ui.ov = freshOv(); ui.tick = 0;
    ui.sel = S.sel; ui.pause = B.pause; ui.flow = S.flow ? Object.assign({}, S.flow) : null;
    ui.evidence = false; ui.evItem = null; ui.pop = null; ui.folds.clear(); ui.log.open.clear();

  function setView(v) { ui.view = v; ui.pop = null; render(); if (ui.flow) scrollFlow(); }
  // Explicit smooth scrolling ignores the CSS reduced-motion rule, so check it here.
  const RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  function scrollBeh() { return RM.matches ? 'auto' : 'smooth'; }
  function scrollFlow() { const f = $('.flow'); if (f) f.scrollIntoView({ block: 'nearest', behavior: scrollBeh() }); }
  function select(id, focus) {
    if (ui.sel !== id) {
      ui.sel = id; ui.evItem = null; ui.folds.clear();
      if (ui.flow && ui.flow.mod !== id) ui.flow = null;
      render();
    }
    if (focus !== false) focusFk(id ? 'tile-' + id : null);
  }
  function openEvidence(item) {
    if (ui.view !== 'modules' || !ui.sel) return;
    ui.evidence = true; if (item) ui.evItem = item; ui.flow = null;
    render();
    const ev = $('#evidence');
    if (ev) { ev.scrollIntoView({ block: 'nearest', behavior: scrollBeh() }); const r = $('.ev-row.is-on', ev) || $('.ev-row', ev); if (r) r.focus({ preventScroll: true }); }
  }
  function openFlow(kind, mod, anchor) {
    ui.flow = { kind: kind, mod: mod, anchor: anchor || null, note: '' };
    ui.pop = null;
    if (ui.view === 'modules') { ui.sel = mod; ui.evidence = false; }
    render();
    scrollFlow();
    const fld = $('#flowCorrect') || $('#flowInstr');
    if (fld) fld.focus({ preventScroll: true });
  }
  function closeFlow() {
    const f = ui.flow; ui.flow = null; render();
    if (f) { if (!focusFk(ui.view === 'modules' ? 'prim-' + f.mod : (f.anchor ? 'lrow-' + f.anchor : null))) focusFk('nb-pause'); }
  }
  function doContinue() {
    const m = model(), nx = nextMod(m), t = nowT(m);
    if (!nx) return;
    const ov = ui.ov;
    ov.events.push(userEvent({ t: t, mod: m.held, type: 'resume', text: 'Continued' }));
    ov.events.push(userEvent({ t: t + 1, mod: nx.id, type: 'start' }));
    ov.st[nx.id] = 'working'; ov.phase = 'working'; ov.active = nx.id; ov.now = t + 4;
    ov.current = { type: 'read', obj: 'shop/discounts.py' }; ov.dirty = true;
    ui.pause = false; ui.tick = 0; ui.sel = nx.id; ui.flow = null; ui.evidence = false; ui.evItem = null;
    render(); toast('Continuing to ' + nx.id);
  }
  function doStop() {
    const m = model(), t = nowT(m), target = m.active || m.held;
    const ov = ui.ov;
    ov.events.push(userEvent({ t: t, mod: target, type: 'stop', text: 'Stopped by you' }));
    if (m.phase === 'working' && m.active) ov.st[m.active] = 'stopped';
    ov.phase = 'stopped'; ov.stoppedMod = m.phase === 'working' ? m.active : null; ov.now = t; ov.dirty = true;
    ui.pause = false; ui.tick = 0; ui.pop = null; ui.flow = null;
    if (target) ui.sel = target;
    render(); toast('Agent stopped'); focusFk('nb-stop');
  }
  function doRedo(k, text, note) {
    const m = model(), t = nowT(m), ci = IDX[k], ov = ui.ov;
    const wasRunning = m.phase === 'working';
    MODS.forEach(function (x) {
      if (IDX[x.id] < ci || m.st[x.id] === 'pending') return;
      const n = attemptNo(x.id);
      ov.replaced[x.id] = (ov.replaced[x.id] || []).concat([{ n: n, events: modData(m, x.id).evs }]);
      ov.attempts[x.id] = n + 1;
    });
    ov.cut = ov.cut && IDX[ov.cut] < ci ? ov.cut : k;
    ov.events = ov.events.filter(function (e) { return e.keep || !(e.mod && IDX[e.mod] >= ci); });
    ov.instr[k] = (ov.instr[k] || []).concat([{ by: 'you', text: text, note: note, t: t }]);
    ov.events.push(userEvent({ t: t, mod: k, type: 'redo', note: note, keep: true }));
    ov.events.push(userEvent({ t: t + 1, mod: k, type: 'start', attempt: attemptNo(k) }));
    MODS.forEach(function (x) { if (IDX[x.id] >= ci) ov.st[x.id] = x.id === k ? 'working' : 'pending'; });
    ov.phase = 'working'; ov.active = k; ov.now = t + 2; ov.current = { type: 'read', obj: 'shop/money.py' }; ov.dirty = true;
    ui.tick = 0; ui.flow = null; ui.pause = false; ui.sel = k; ui.evidence = false; ui.evItem = null;
    render(); toast((wasRunning ? 'Stopped. ' : '') + 'Redoing from ' + k + ' with v' + instrVersions(k).length);
    focusFk('tile-' + k);
  }
  function doChange(k, text) {
    const m = model(), t = nowT(m), ov = ui.ov;
    ov.instr[k] = (ov.instr[k] || []).concat([{ by: 'you', text: text, t: t }]);
    ov.events.push(userEvent({ t: t, mod: k, type: 'change', v: instrVersions(k).length, keep: true }));
    ov.dirty = true; ui.flow = null;
    render(); toast(k + ' instructions saved as v' + instrVersions(k).length);
    focusFk(ui.view === 'modules' ? 'prim-' + k : 'nb-pause');
  }
  function doCorrect(k, text) {
    const m = model(), t = nowT(m), ov = ui.ov;
    ov.instr[k] = (ov.instr[k] || []).concat([{ by: 'you', text: text, t: t, kind: 'correction' }]);
    ov.events.push(userEvent({ t: t, mod: k, type: 'correct', text: text }));
    ov.dirty = true; ui.flow = null;
    render(); toast('Correction queued · reaches ' + k + ' after ' + (m.current ? m.current.obj : 'this step'));
  }
  function doNote(text) {
    const m = model(), t = nowT(m);
    ui.ov.events.push(userEvent({ t: t, mod: m.active || m.held || null, type: 'note', text: text }));
    ui.ov.dirty = true; ui.pop = null;
    render(); toast('Note queued · reaches the agent after ' + (m.current ? m.current.obj : 'its next step'));
    focusFk('nb-note');
  }

  const ACT = {
    noop: function () {},
    legend: function () { ui.pop = ui.pop && ui.pop.kind === 'legend' ? null : { kind: 'legend', fk: 'legend' }; render(); if (ui.pop) focusFk('legend-x'); },
    sel: function (t) { select(t.dataset.id); },
    evid: function () { if (ui.evidence) { ui.evidence = false; render(); } else openEvidence(); },
    'ev-item': function (t) { openEvidence(t.dataset.k); },
    'ev-instr': function (t) { ui.sel = t.dataset.id; openEvidence('iv'); },
    'ev-fold': function (t) { const k = t.dataset.k; if (ui.folds.has(k)) ui.folds.delete(k); else ui.folds.add(k); render(); },
    'flow-open': function (t) { openFlow(t.dataset.kind, t.dataset.mod, t.dataset.anchor); },
    'flow-cancel': function () { closeFlow(); },
    pause: function () { const m = model(); if (m.phase !== 'working') return; ui.pause = !ui.pause; ui.animMarker = true; render(); ui.animMarker = false; toast(ui.pause ? 'Will pause after ' + m.active : 'Pause cancelled · runs to the end'); },
    note: function () { ui.pop = ui.pop && ui.pop.kind === 'note' ? null : { kind: 'note', fk: 'nb-note' }; render(); const i = $('#noteInput'); if (i) i.focus(); },
    stop: function (t) { ui.pop = { kind: 'stop', fk: t.dataset.fk }; render(); focusFk('stop-cancel'); },
    'pop-close': function () { closePop(true); },
    'stop-confirm': function () { doStop(); },
    continue: function () { doContinue(); },
    flag: function () {

      if (ui.view === 'log') { ui.log.flagged = !ui.log.flagged; render(); return; }
      ui.flash = true; select(f.mod, false); render();
      const el = $('.c-flag'); if (el) el.scrollIntoView({ block: 'nearest', behavior: scrollBeh() });
      setTimeout(function () { ui.flash = false; const e2 = $('.c-flag.flash'); if (e2) e2.classList.remove('flash'); }, 1400);
    },
    state: function (t) { setState(t.dataset.v); },
    view: function (t) { setView(t.dataset.v); },
    theme: function (t) { ui.theme = t.dataset.v; try { localStorage.setItem('ct-theme', ui.theme); } catch (err) { /* ignore */ } render(); },
    'log-mod': function (t) { ui.log.mod = t.dataset.v; render(); },
    'log-type': function (t) { const v = t.dataset.v; if (ui.log.types.has(v)) ui.log.types.delete(v); else ui.log.types.add(v); render(); },
    'log-flag': function () { ui.log.flagged = !ui.log.flagged; render(); },
    lrow: function (t) { const k = t.dataset.k; if (ui.log.open.has(k)) ui.log.open.delete(k); else ui.log.open.add(k); render(); }
  };

  /* =====================================================================
     11. EVENTS: click, submit, keyboard, tooltips, timers
     ===================================================================== */
  document.addEventListener('click', function (e) {
    const t = e.target.closest('[data-act]');
    if (ui.pop && !e.target.closest('#pop') && !(t && (t.dataset.act === 'note' || t.dataset.act === 'stop' || t.dataset.act === 'legend'))) closePop(false);
    if (!t || t.getAttribute('aria-disabled') === 'true') return;

    if (fn) { e.preventDefault(); fn(t, e); }
  });
  document.addEventListener('submit', function (e) {
    const f = e.target;
    e.preventDefault();
    const kind = f.dataset.form, mod = f.dataset.mod, dk = kind + ':' + mod;
    if (kind === 'note') { const v = $('#noteInput').value.trim(); if (v) { ui.noteDraft = ''; doNote(v); } else $('#noteInput').focus(); }
    else if (kind === 'redo') { const ti = $('#flowInstr').value.trim() || MOD[mod].instr, no = $('#flowNote').value.trim(); delete ui.drafts[dk]; doRedo(mod, ti, no); }
    else if (kind === 'change') { const tx = $('#flowInstr').value.trim(); if (tx) { delete ui.drafts[dk]; doChange(mod, tx); } }
    else if (kind === 'correct') { const c = $('#flowCorrect').value.trim(); if (c) { delete ui.drafts[dk]; doCorrect(mod, c); } else $('#flowCorrect').focus(); }
  });
  const DRAFT_FIELD = { flowInstr: 'instr', flowNote: 'note', flowCorrect: 'correct' };
  document.addEventListener('input', function (e) {
    const t = e.target;
    if (t.id === 'logSearch') { ui.log.q = t.value; renderLogList(); return; }
    if (t.id === 'noteInput') { ui.noteDraft = t.value; return; }
    const fm = t.closest && t.closest('form.flow');
    if (fm && DRAFT_FIELD[t.id]) {
      const dk = fm.dataset.form + ':' + fm.dataset.mod;
      (ui.drafts[dk] = ui.drafts[dk] || {})[DRAFT_FIELD[t.id]] = t.value;
    }
  });
  function escUp() {
    hideTip();
    if (ui.pop) { closePop(true); return true; }
    if (ui.flow) { closeFlow(); return true; }
    if (ui.view === 'modules') {
      if (ui.evidence) { ui.evidence = false; render(); focusFk('evbtn'); return true; }
      const m = model();
      if (ui.sel && canSummary(m)) { const s = ui.sel; ui.sel = null; ui.evItem = null; render(); focusFk('tile-' + s) || focusFk('tile-PRE'); return true; }
    } else if (ui.log.open.size) { ui.log.open.clear(); const a = document.activeElement && document.activeElement.dataset.fk; renderLogList(); focusFk(a); return true; }
    return false;
  }
  function move(dir) {
    if (ui.view === 'modules') {
      const order = ['PRE'].concat(MODS.map(function (x) { return x.id; }));
      let i = order.indexOf(ui.sel);
      i = i < 0 ? (dir > 0 ? 0 : order.length - 1) : Math.max(0, Math.min(order.length - 1, i + dir));
      select(order[i]);
    } else {
      const rows = $$('.lrow-main');
      if (!rows.length) return;
      let i = rows.indexOf(document.activeElement);
      i = i < 0 ? (dir > 0 ? 0 : rows.length - 1) : Math.max(0, Math.min(rows.length - 1, i + dir));
      rows[i].focus(); rows[i].scrollIntoView({ block: 'nearest' });
    }
  }
  document.addEventListener('keydown', function (e) {
    const tg = e.target, tag = tg && tg.tagName;
    const typing = tag === 'INPUT' || tag === 'TEXTAREA' || (tg && tg.isContentEditable);

      const f = tabbables($('#pop')), first = f[0], last = f[f.length - 1];
      if (ui.pop.kind === 'stop') {
        if (e.shiftKey && tg === first) { e.preventDefault(); last.focus(); }

    if (tg && tg.closest && tg.closest('form, #pop')) return;

    if (e.key === 'j' || e.key === 'k') { e.preventDefault(); move(e.key === 'j' ? 1 : -1); return; }
    const onTile = tg && tg.closest && tg.closest('.tile');
    if (onTile && (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowUp')) { e.preventDefault(); move(e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : -1); return; }
    if (e.key === 'Enter' && ui.view === 'modules') {
      if (onTile && onTile.dataset.id === ui.sel) { e.preventDefault(); openEvidence(); return; }
      if (!onTile && (tg === document.body || tg.id === 'detail')) { e.preventDefault(); openEvidence(); }
    }
  });

  // Tooltips on hover AND keyboard focus.
  const tip = $('#tip');
  // The shown tooltip is wired to its trigger with aria-describedby, so screen readers hear it too.
  // It can be hovered (WCAG 1.4.13): leaving the trigger waits briefly, and Esc dismisses it.
  let tipEl = null, tipHideT = null;
  function showTip(el) {
    clearTimeout(tipHideT);
    const t = el.getAttribute('data-tip');
    if (!t) return;
    if (ui.pop && el.dataset.fk && el.dataset.fk === ui.pop.fk) return;
    if (tipEl && tipEl !== el) unDescribe(tipEl);
    tip.innerHTML = t === '@legend' ? LEGEND_ACT : esc(t);
    tip.hidden = false; tipEl = el;
    if (el.getAttribute('aria-label') !== t && !el.hasAttribute('aria-describedby')) el.setAttribute('aria-describedby', 'tip');
    const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    const x = Math.max(8, Math.min(window.innerWidth - tw - 8, r.left + r.width / 2 - tw / 2));
    let y = r.bottom + 8;
    if (y + th > window.innerHeight - 8) y = r.top - th - 8;
    tip.style.left = x + 'px'; tip.style.top = Math.max(8, y) + 'px';
  }
  function unDescribe(el) { if (el.getAttribute('aria-describedby') === 'tip') el.removeAttribute('aria-describedby'); }
  function hideTip() { clearTimeout(tipHideT); if (tipEl) unDescribe(tipEl); tip.hidden = true; tipEl = null; }
  document.addEventListener('mouseover', function (e) {
    if (!e.target.closest) return;
    if (e.target.closest('#tip')) { clearTimeout(tipHideT); return; }
    const el = e.target.closest('[data-tip]');
    if (el && el !== tipEl) showTip(el);
    else if (el) clearTimeout(tipHideT);
    else if (tipEl) { clearTimeout(tipHideT); tipHideT = setTimeout(hideTip, 200); }
  });
  tip.addEventListener('pointerdown', function () { hideTip(); });
  document.addEventListener('focusin', function (e) {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el && el === e.target) showTip(el); else hideTip();
  });
  document.addEventListener('focusout', function () { hideTip(); });
  window.addEventListener('scroll', function () { hideTip(); placePop(); }, true);
  window.addEventListener('resize', function () { hideTip(); placePop(); fitChrome(); if (ui.view === 'modules') layoutPlan(model()); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (ui.view === 'modules') layoutPlan(model()); });

  // Live timers: elapsed time while working, the user's waiting time while waiting.
  setInterval(function () {
    const B = D.states[baseKey()], ph = ui.ov.phase || B.phase;
    if (ph !== 'working' && ph !== 'waiting') return;
    ui.tick++;
    $$('[data-live]').forEach(function (el) { el.textContent = fmt(+el.dataset.base + ui.tick); });
  }, 1000);

  setState('working');
})();
