<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Observation Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ---------- Tokens: dark (default) ---------- */
:root{
  --bg:#0F172A; --surface:#1B2336; --muted:#272F42; --primary:#1E293B;
  --border:#475569; --border-strong:#64748B; --hair:rgba(148,163,184,.16); --hair-2:rgba(148,163,184,.28);
  --connector:#64748B;
  --fg:#F8FAFC; --fg-2:#CBD5E1; --fg-muted:#94A3B8;
  --ok:#22C55E; --ok-bg:rgba(34,197,94,.12);
  --warn:#F59E0B; --warn-fg:#F59E0B; --warn-bg:#3A2C0E; --warn-line:rgba(245,158,11,.6);
  --danger:#EF4444; --danger-fg:#F87171; --danger-solid:#C62828; --danger-bg:rgba(239,68,68,.10);
  --active:#60A5FA; --active-bg:rgba(96,165,250,.14);
  --pending:#8391A7;
  --accent:#60A5FA; --accent-hover:#93C5FD; --on-accent:#0F172A; --on-danger:#FFFFFF;
  --focus:#93C5FD; --knock:#1B2336;
  --read:#94A3B8; --edit:#60A5FA; --bash:#E2E8F0;
  --add-bg:rgba(34,197,94,.13); --del-bg:rgba(239,68,68,.13); --add-fg:#4ADE80; --del-fg:#FCA5A5;
  --shadow:0 10px 28px rgba(2,6,23,.45);
  --mock:#C084FC; --mock-bg:#161226; --mock-fg:#E9D5FF;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px; --t:180ms;
}
/* ---------- Tokens: light (re-tuned, not inverted) ---------- */
:root[data-theme="light"]{
  --bg:#F4F6FA; --surface:#FFFFFF; --muted:#EEF2F7; --primary:#FFFFFF;
  --border:#CBD5E1; --border-strong:#8492A6; --hair:rgba(15,23,42,.09); --hair-2:rgba(15,23,42,.16);
  --connector:#64748B;
  --fg:#0F172A; --fg-2:#334155; --fg-muted:#526175;
  --ok:#15803D; --ok-bg:#EAF7EF;
  --warn:#B45309; --warn-fg:#92400E; --warn-bg:#FDECC8; --warn-line:#C2850C;
  --danger:#DC2626; --danger-fg:#B91C1C; --danger-solid:#B91C1C; --danger-bg:#FDF0F0;
  --active:#2563EB; --active-bg:#EAF1FE;
  --pending:#64748B;
  --accent:#1D4ED8; --accent-hover:#1E40AF; --on-accent:#FFFFFF; --on-danger:#FFFFFF;
  --focus:#2563EB; --knock:#FFFFFF;
  --read:#64748B; --edit:#2563EB; --bash:#334155;
  --add-bg:#E7F6EC; --del-bg:#FCEBEB; --add-fg:#166534; --del-fg:#B91C1C;
  --shadow:0 10px 28px rgba(15,23,42,.12);
  --mock:#7E22CE; --mock-bg:#FAF5FF; --mock-fg:#581C87;
}
/* ---------- Base ---------- */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/1.45 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
[aria-disabled="true"]{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:-.01em}
.muted{color:var(--fg-muted)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px;padding:0;border:0}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.i.s14{width:14px;height:14px}.i.s16{width:16px;height:16px}
.g{flex:none;display:block}
.cap{font-size:12px;font-weight:500;color:var(--fg-muted);display:flex;align-items:center;gap:6px;margin:0 0 8px;letter-spacing:.02em}
.app{display:flex;flex-direction:column;height:100vh}
.gap{flex:1}

/* ---------- Buttons ---------- */
.ib{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:var(--r);color:var(--fg-2);border:1px solid var(--hair-2);background:transparent;transition:background var(--t),border-color var(--t),color var(--t)}
.ib:hover:not([aria-disabled="true"]){background:var(--muted);color:var(--fg)}
.ib[aria-pressed="true"]{background:var(--active-bg);border-color:var(--active);color:var(--active)}
.ib.danger{color:var(--danger-fg);border-color:color-mix(in srgb,var(--danger) 55%,transparent)}
.ib.danger:hover:not([aria-disabled="true"]){background:var(--danger-bg);color:var(--danger-fg)}
.btn{height:32px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;border-radius:var(--r);border:1px solid var(--hair-2);color:var(--fg);font-weight:500;font-size:14px;white-space:nowrap;transition:background var(--t),border-color var(--t),color var(--t);flex:none}
.btn:hover:not([aria-disabled="true"]){background:var(--muted)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not([aria-disabled="true"]){background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--danger-fg);border-color:color-mix(in srgb,var(--danger) 60%,transparent)}
.btn.danger:hover:not([aria-disabled="true"]){background:var(--danger-bg)}
.btn.danger-solid{background:var(--danger-solid);border-color:var(--danger-solid);color:var(--on-danger)}
.btn.danger-solid:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;color:var(--fg-muted)}
.btn.ghost.danger:hover{color:var(--danger-fg)}
.linkbtn{font-weight:500;text-align:left;border-radius:4px;min-height:28px;display:inline-flex;align-items:center}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}
.sep{width:1px;height:24px;background:var(--hair-2);flex:none}

/* ---------- Chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:4px;border:1px solid var(--hair-2);background:var(--muted);color:var(--fg-2);font-size:12px;white-space:nowrap;max-width:100%;flex:none}
.chip .mono{overflow:hidden;text-overflow:ellipsis}
.chip.ok{border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:var(--ok-bg);color:var(--fg)}
.chip.ok .i{color:var(--ok)}
.chip.strike{text-decoration:line-through;text-decoration-color:var(--danger-fg);text-decoration-thickness:1.5px;color:var(--fg-muted);background:transparent;border-style:dashed}
.chip.ver{background:transparent;height:28px;cursor:pointer;transition:border-color var(--t)}
.chip.ver:hover{border-color:var(--border-strong)}
.chip.you{border-color:var(--active);color:var(--active)}

/* ---------- Now bar (Level 0) ---------- */
.now{flex:none;position:relative;z-index:20;background:var(--primary);border-bottom:1px solid var(--hair-2)}
.now-row{display:flex;align-items:center;gap:14px;min-height:60px;padding:10px 20px}
.now-state{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.now-title{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.now-title .mono{font-size:14px;font-weight:500}
.now-title .dot{color:var(--fg-muted);font-weight:400;margin:0 6px}
.now-act{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:var(--r);background:var(--muted);color:var(--fg-2);flex:none}
.now-mid{display:flex;align-items:center;gap:12px;flex:none}
.now-ctl{display:flex;align-items:center;gap:8px;flex:none}
.flagct{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 10px;border-radius:var(--r);color:var(--warn-fg);border:1px solid var(--warn-line);font-family:var(--mono);font-size:12px;font-weight:500}
.flagct:hover{background:var(--warn-bg)}
.next{display:inline-flex;align-items:center;gap:5px;color:var(--fg-muted);font-size:12px;white-space:nowrap}
.next b{font-family:var(--mono);font-weight:500;color:var(--fg)}
.segs{display:flex;align-items:center;gap:3px}
.seg{position:relative;height:28px;width:42px;display:grid;align-items:center}
.seg i{display:block;height:10px;border-radius:2px;border:1.5px solid var(--pending);position:relative;overflow:hidden}
.seg.s-pending i{border-style:dashed}
.seg.s-verified i{background:var(--ok);border-color:var(--ok)}
.seg.s-unverified i{border-color:var(--ok)}
.seg.s-unverified i::after{content:"";position:absolute;inset:0 50% 0 0;background:var(--ok)}
.seg.s-working i{border-color:var(--active)}
.seg.s-working i::after{content:"";position:absolute;top:0;bottom:0;left:0;width:55%;background:var(--active-bg);border-right:3px solid var(--active)}
.seg.s-stopped i{border-color:var(--danger)}
.seg.s-stopped i::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;transform:translate(-50%,-50%);background:var(--danger);border-radius:1px}
.seg.sel i{outline:1.5px solid var(--fg-muted);outline-offset:2px}
.seg-stop{width:3px;height:20px;border-radius:2px;background:var(--active);margin:0 2px;flex:none}
.seg-hold{width:10px;height:10px;transform:rotate(45deg);background:var(--warn);margin:0 3px;flex:none}
.now.waiting{background:var(--warn-bg);border-bottom:2px solid var(--warn);box-shadow:inset 4px 0 0 var(--warn)}
.decide{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 20px 12px 54px}
.timer{font-family:var(--mono);font-size:14px;color:var(--warn-fg);font-weight:500;display:inline-flex;align-items:center;gap:5px;flex:none}
.happened{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:var(--r);background:var(--surface);border:1px solid var(--hair-2);color:var(--fg-2);font-size:12px;white-space:nowrap;flex:none}
.note{display:flex;align-items:center;gap:10px;padding:10px 20px;border-top:1px solid var(--hair);background:var(--surface)}
.note label{font-size:12px;color:var(--fg-muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.inp{height:32px;padding:0 10px;border-radius:var(--r);border:1px solid var(--border-strong);background:var(--bg);min-width:0}
.inp:focus{border-color:var(--focus)}
.inp:focus-visible,.ed textarea:focus-visible{outline-offset:1px}
.note .inp{flex:1}
.pop{position:absolute;right:16px;top:calc(100% + 6px);z-index:60;width:290px;padding:14px;border-radius:8px;background:var(--surface);border:1px solid var(--hair-2);box-shadow:var(--shadow)}
.pop h3{margin:0 0 4px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center}
.pop p{margin:0 0 12px;color:var(--fg-muted);font-size:12px}
.pop .row-btns{display:flex;justify-content:flex-end;gap:8px}

/* ---------- Main layout ---------- */
.main{flex:1;min-height:0;position:relative;display:grid;grid-template-columns:380px minmax(0,1fr)}
.main.logv{grid-template-columns:minmax(0,1fr)}
.pane{min-height:0;overflow:auto;padding:20px 20px 88px}
.rail{border-right:1px solid var(--hair-2)}

/* ---------- Plan rail (Level 1) ---------- */
.rail-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:0 4px}
.rail-head .cap{margin:0}
.rlist{list-style:none;margin:0;padding:0;position:relative}
/* connector sits above row backgrounds (so selection never breaks the line) and below the glyphs */
.rlist::before{content:"";position:absolute;left:23px;top:20px;bottom:28px;width:2px;background:var(--connector);z-index:1}
.rrow{--rowbg:var(--bg);position:relative;width:100%;display:grid;grid-template-columns:24px minmax(0,1fr) 18px;align-items:center;gap:10px;min-height:58px;padding:7px 8px 7px 12px;border-radius:var(--r);text-align:left;transition:background var(--t)}
.rrow:hover{--rowbg:color-mix(in srgb,var(--muted) 60%,var(--bg));background:var(--rowbg)}
.rrow.sel{--rowbg:var(--muted);background:var(--rowbg);box-shadow:inset 2px 0 0 var(--accent)}
.rrow .gw{width:24px;height:24px;display:grid;place-items:center;background:var(--rowbg);border-radius:50%;position:relative;z-index:2;transition:background var(--t)}
.rsum{min-height:44px;margin-bottom:8px}
.rsum .gw{color:var(--fg-2)}
.rrow .rid{font-family:var(--mono);font-size:12px;color:var(--fg-muted);font-weight:500}
.rrow .rt{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow.pre{min-height:40px}
.rrow.pre .rt{font-size:12px;color:var(--fg-muted);font-weight:400}
.rbody{display:grid;gap:4px;min-width:0}
.rl1{display:flex;align-items:center;gap:8px;min-width:0}
.rrow.pre .rl1{justify-content:space-between}
.rrow.dim .rt,.rrow.dim .rid{color:var(--fg-muted);text-decoration:line-through;text-decoration-color:var(--hair-2)}
.rev{display:flex;align-items:center;gap:8px;min-height:14px}
.fdots{display:flex;gap:4px;align-items:center}
.fdot{width:8px;height:10px;border:1.5px solid var(--read);border-radius:1.5px;display:block}
.tsq{width:6px;height:6px;background:var(--bash);display:block;margin-left:2px}
.dep{width:18px;height:18px;display:grid;place-items:center;border-radius:4px;color:var(--fg-muted)}
.dep.up,.dep.down{color:var(--accent);background:var(--active-bg)}
.dep.keep{color:var(--ok)}
.needs{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--fg-muted)}
.needs b{font-family:var(--mono);font-weight:500;color:var(--fg-2)}
.bound{position:relative;height:28px;display:flex;align-items:center;padding-left:46px;gap:6px;font-size:12px;color:var(--active)}
.bound::before{content:"";position:absolute;left:36px;right:8px;top:50%;border-top:1.5px dashed var(--active)}
.bound .bb{position:absolute;left:12px;top:2px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:1.5px solid var(--active);color:var(--active);z-index:2}
.bound .bt{position:relative;background:var(--bg);padding:0 6px;font-family:var(--mono)}
.bound.hold{color:var(--warn)}
.bound.hold::before{border-top-color:var(--warn)}
.bound.hold .bb{border:0}
.elap{font-family:var(--mono);font-size:12px;color:var(--active)}
.khint{display:flex;gap:4px;margin:16px 0 0 12px;opacity:.85}
kbd{font-family:var(--mono);font-size:12px;min-width:20px;height:20px;padding:0 5px;display:inline-grid;place-items:center;border-radius:4px;border:1px solid var(--hair-2);color:var(--fg-muted);background:var(--surface)}

/* ---------- Graphics ---------- */
.dbar{display:inline-flex;align-items:center;width:62px;height:12px;position:relative;flex:none}
.dbar::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:1.5px;background:var(--border-strong)}
.dbar .dl,.dbar .da{position:absolute;top:3px;height:6px;border-radius:1px}
.dbar .dl{right:33px;background:var(--danger)}
.dbar .da{left:33px;background:var(--ok)}
.dnum{font-family:var(--mono);font-size:12px;white-space:nowrap}
.dnum .a{color:var(--add-fg)}.dnum .d{color:var(--del-fg);margin-left:4px}
.pips{display:inline-flex;align-items:center;gap:2px;height:12px;flex:none}
.pip{width:5px;height:8px;border-radius:1px;background:var(--ok);display:block}
.pip.f{height:12px;background:transparent;border:1.5px solid var(--danger);position:relative;border-radius:1px}
.pip.f::after{content:"";position:absolute;left:0;right:0;top:50%;height:1.5px;background:var(--danger);transform:translateY(-50%)}
.pips.none .pip{background:transparent;border:1px dashed var(--pending)}
.strip{display:block;overflow:visible;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-origin:12px 12px;animation:spin 1.6s linear infinite}
@media (prefers-reduced-motion:reduce){.spin{animation:none}*{transition:none!important}}

/* ---------- Module card (Level 2) ---------- */
.card{background:var(--surface);border:1px solid var(--hair-2);border-radius:10px;max-width:880px;margin:0 auto}
.card-h{display:flex;align-items:center;gap:12px;padding:16px 20px 6px}
.card-h h2{margin:0;font-size:18px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-h .cid{font-family:var(--mono);font-size:14px;color:var(--fg-muted);font-weight:500}
.goal{margin:0;padding:0 20px 14px 56px;color:var(--fg-2)}
.callout{margin:0 20px 14px;width:calc(100% - 40px);min-height:40px;padding:6px 12px;border-radius:var(--r);display:flex;align-items:center;gap:10px;border:1px solid var(--warn-line);background:var(--warn-bg);font-size:14px;text-align:left;transition:border-color var(--t)}
.callout:hover{border-color:var(--warn)}
.callout > .i{color:var(--warn-fg)}
.callout .seq{display:inline-flex;align-items:center;gap:6px;color:var(--fg-2)}
.callout .seq .ic-edit{display:inline-flex}
.cgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);border-top:1px solid var(--hair)}
.blk{padding:14px 20px;min-width:0}
.cgrid .blk:nth-child(odd){border-right:1px solid var(--hair)}
.cgrid .blk:nth-child(n+3){border-top:1px solid var(--hair)}
.crit{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.crit li{display:grid;grid-template-columns:18px minmax(0,1fr) 22px;gap:8px;align-items:center}
.src{width:22px;height:22px;display:grid;place-items:center;border-radius:4px;color:var(--fg-muted)}
.src.tests{color:var(--ok)}.src.agent{color:var(--warn)}
.trow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tnum{font-family:var(--mono);font-size:18px;font-weight:500}
.tnum small{font-size:12px;color:var(--fg-muted)}
.stale{display:inline-flex;align-items:center;gap:14px}
.stale .g{opacity:.6}
.stale .tnum{color:var(--fg-muted)}
.livet{display:inline-flex;align-items:center}
.frow{display:grid;grid-template-columns:16px minmax(0,1fr) auto auto 28px;gap:8px;align-items:center;min-height:30px}
.frow .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{width:28px;height:28px;display:grid;place-items:center;border-radius:var(--r);color:var(--fg-muted);border:1px solid transparent;transition:background var(--t)}
.mini:hover{background:var(--muted);color:var(--fg);border-color:var(--hair-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.actblk{border-top:1px solid var(--hair);display:flex;align-items:center;gap:16px;padding:12px 20px 16px;flex-wrap:wrap}
.actblk .cap{margin:0}
.stripw{flex:1;min-width:120px;display:flex;align-items:center;gap:10px}
.stripw .mono{color:var(--fg-muted)}
.stripw .strip{max-width:calc(100% - 80px);height:auto}
.empty{color:var(--fg-muted);font-size:12px}
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:12px;color:var(--fg-2)}
.badge.ok{color:var(--ok)}.badge.bad{color:var(--danger-fg)}.badge.live{color:var(--active)}

/* inline editors + redo panel */
.ed{margin:0 20px 16px;padding:14px;border-radius:8px;border:1px solid var(--hair-2);background:var(--bg)}
.ed h3{margin:0 0 10px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.ed label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-muted);margin:0 0 6px}
.ed textarea{width:100%;min-height:72px;resize:vertical;padding:8px 10px;border-radius:var(--r);border:1px solid var(--border-strong);background:var(--surface);font:400 12px/1.6 var(--mono)}
.ed textarea:focus{border-color:var(--focus)}
.ed .inp{width:100%;background:var(--surface)}
.ed .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.ed.redo{border-color:color-mix(in srgb,var(--danger) 50%,transparent)}
.ed.redo h3 .i{color:var(--danger-fg)}
.redo-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.cq{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.cq li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start}
.cq .cqi{width:22px;height:22px;display:grid;place-items:center;color:var(--fg-muted)}
.cq .cqi.stopi{color:var(--danger-fg)}
.cq .cqt{font-size:12px;color:var(--fg-muted);margin-bottom:4px}
.ri{position:relative;display:inline-grid;margin-right:4px}
.ri .i + .i{position:absolute;right:-6px;bottom:-4px;width:11px;height:11px;background:var(--muted);border-radius:50%;color:var(--active);stroke-width:2}
.tl{display:flex;align-items:center;gap:3px}

// Diverging diff bar: deletions grow left of the center tick, additions grow right (position + color)
const MAXL = 40;
function dbar(add, del, tip = true) {
  const w = n => n ? Math.max(2, Math.round(Math.min(n, MAXL) / MAXL * 28)) : 0;
  const lab = `+${add} −${del} lines`;
  return `<span class="dbar" role="img" aria-label="${lab}" ${tip ? `data-tip="${lab}"` : ""}><i class="dl" style="width:${w(del)}px"></i><i class="da" style="width:${w(add)}px"></i></span>`;
}
const dnum = (add, del) => `<span class="dnum"><span class="a">+${add}</span><span class="d">−${del}</span></span>`;

// Test pips: pass = solid short block, fail = tall outlined block with bar, none = dashed
function pips(pass, fail, tip = true) {
  const lab = `${pass} passed, ${fail} failed`;
  let h = "";
  for (let i = 0; i < pass; i++) h += '<i class="pip"></i>';
  for (let i = 0; i < fail; i++) h += '<i class="pip f"></i>';
  return `<span class="pips" role="img" aria-label="${lab}" ${tip ? `data-tip="${lab}"` : ""}>${h}</span>`;
}

// Test ring: pass arc (solid) + fail arc (dashed)
function ring(pass, fail, size = 40) {
  const tot = pass + fail, r = 15, c = 2 * Math.PI * r, pa = c * pass / tot, fa = c * fail / tot;
  const lab = `${pass} of ${tot} tests passed`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" role="img" aria-label="${lab}" data-tip="${lab}" class="g">
    <circle cx="20" cy="20" r="${r}" fill="none" stroke="var(--muted)" stroke-width="5"/>
    <circle cx="20" cy="20" r="${r}" fill="none" stroke="var(--ok)" stroke-width="5" stroke-dasharray="${pa} ${c}" transform="rotate(-90 20 20)"/>
    ${fail ? `<circle cx="20" cy="20" r="${r}" fill="none" stroke="var(--danger)" stroke-width="5" stroke-dasharray="${fa} ${c}" stroke-dashoffset="${-pa}" transform="rotate(-90 20 20)"/>` : ""}
    ${fail ? `<path d="M17 17l6 6M23 17l-6 6" stroke="var(--danger)" stroke-width="2" stroke-linecap="round"/>` : `<path d="M15 20.5l3.5 3.5 6.5-7" fill="none" stroke="var(--ok)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`}
  </svg>`;
}

// Activity strip: one tick per action, shape by type (read short bar, edit tall bar, bash square, test dot / x)
function strip(actions, t0, t1, w = 140, focusable = true) {
  const span = Math.max(1, t1 - t0), H = 18, pad = 4;
  const x = t => pad + (Math.min(Math.max(t - t0, 0), span) / span) * (w - pad * 2);
  let h = `<line x1="0" y1="${H / 2}" x2="${w}" y2="${H / 2}" stroke="var(--hair-2)" stroke-width="1"/>`;
  const counts = {read:0, edit:0, bash:0, test:0};
  actions.forEach(a => {
    const X = x(sec(a.t)).toFixed(1); counts[a.k] = (counts[a.k] || 0) + 1;
    if (a.live) h += `<circle cx="${X}" cy="${H / 2}" r="3.5" fill="var(--surface)" stroke="var(--active)" stroke-width="1.5"/>`;
    else if (a.k === "read") h += `<rect x="${X - 1}" y="5" width="2" height="8" rx="1" fill="var(--read)"/>`;
    else if (a.k === "edit") h += `<rect x="${X - 1.25}" y="0" width="2.5" height="18" rx="1" fill="var(--edit)"/>`;
    else if (a.k === "bash") h += `<rect x="${X - 2.5}" y="6.5" width="5" height="5" fill="var(--bash)"/>`;
    else if (a.k === "test") h += a.fail
      ? `<path d="M${X - 3} 6l6 6M${+X + 3} 6l-6 6" stroke="var(--danger)" stroke-width="1.8" stroke-linecap="round"/>`
      : `<circle cx="${X}" cy="${H / 2}" r="3.2" fill="var(--ok)"/>`;
  });
  const lab = `Activity: ${counts.read} read, ${counts.edit} edit, ${counts.bash} command, ${counts.test} test runs`;
  return `<svg class="strip" width="${w}" height="${H}" viewBox="0 0 ${w} ${H}" role="img" aria-label="${lab}" ${focusable ? 'tabindex="0" data-tip="legend"' : 'data-tip="legend"'}>${h}</svg>`;
}

/* =========================================================
   4. DERIVED MODEL for the current state
   ========================================================= */
const isFin = () => S.run === "finished" || S.run === "redo";
function mod(id) {
  const m = D.modules.find(x => x.id === id);
  const v = Object.assign({}, m);
  v.instr = m.instr.concat(S.instrExtra[id] || []);
  if (id === "M3") {
    if (S.run === "working") {
      v.status = S.stopped ? "stopped" : "working";
      v.end = null;
      v.criteria = m.criteria.map(c => ({text:c.text, st:"open", src:null}));
      v.actions = m.actions.concat(S.stopped ? [] : [m.liveAction]);
    } else {
      v.status = "unverified";
      v.criteria = m.criteria.map(c => ({text:c.text, st:"claimed", src:"agent"}));
      v.actions = m.actions.slice();
    }
  }
  if (id === "M4" && !isFin()) {
    v.status = "pending"; v.start = null; v.end = null; v.files = []; v.tests = null; v.looked = []; v.actions = [];
    v.criteria = m.criteria.map(c => ({text:c.text, st:"open", src:null}));
  }
  if (!v.status) v.status = "verified";
  return v;
}
const mods = () => D.modules.map(m => mod(m.id));
const flags = () => S.run === "working" ? [] : [D.flag];
const activeId = () => S.run === "working" ? "M3" : null;
const nextId = () => isFin() ? null : "M4";
// Where the agent will stop next if pause is armed (boundary after this module id)
const pauseAfter = () => S.run === "working" ? "M3" : S.run === "waiting" ? "M4" : null;
const downstream = id => D.modules.filter(m => m.deps.includes(id)).map(m => m.id);
const upstream = id => (D.modules.find(m => m.id === id) || {deps:[]}).deps;
const elapsed = v => v.end ? fmt(sec(v.end) - sec(v.start)) : (v.start ? fmt(S.m3Sec) : "");
function attemptsFrom(id) { // modules that would be replaced by redo-from-id
  const idx = D.modules.findIndex(m => m.id === id);
  return mods().slice(idx).filter(v => v.status !== "pending");
}

function segsHtml() {

      <input id="note-in" class="inp" data-draft="note" value="${esc(S.drafts.note || "")}" placeholder="One line for the agent" autocomplete="off">
      <button class="btn primary sm" data-act="note-send">${ic("send", "s14")}Send</button>
      <button class="ib" data-act="note" aria-label="Close note" data-tip="Close (Esc)">${ic("x")}</button></div>`;
  }
  if (S.stopAsk) h += `<div class="pop" role="alertdialog" aria-labelledby="stop-h" aria-describedby="stop-p">
      <h3 id="stop-h">${gl("stopped", 18, {label:false})}Stop the agent?</h3>
      <p id="stop-p">It halts right away. Files stay as they are.</p>
      <div class="row-btns"><button class="btn sm" data-act="stop-cancel">Cancel</button><button class="btn sm danger-solid" data-act="stop-confirm">${ic("stop", "s14")}Stop agent</button></div></div>`;
  el.innerHTML = h;
}

/* =========================================================
   6. RENDER: Level 1 — Plan rail (modular view)
   ========================================================= */
function renderRail() {
  const ms = mods(), sel = S.sel;
  const isMod = sel && sel !== "pre";
  const ups = isMod ? upstream(sel) : [], downs = isMod ? downstream(sel) : [];
  const pa = S.pause ? pauseAfter() : null;
  const redoId = S.editor && S.editor.type === "redo" ? S.editor.id : null;
  const repl = redoId ? attemptsFrom(redoId).map(v => v.id) : [];
  const redoIdx = redoId ? D.modules.findIndex(m => m.id === redoId) : -1;
  const fl = flags().map(f => f.module);

  const files = D.pre.actions.filter(a => a.k === "read");
  const preLab = `${files.length} files read, ran ls`;
  let h = `<div class="rail-head"><h2 class="cap">${ic("plan", "s16")}Plan</h2><span class="chip mono" role="img" data-tip="Plan v1 · by agent" aria-label="Plan version 1, by agent">${ic("bot", "s14")}v1</span></div>`;
  // Finished run: a way back up to the run summary (Level 2 default when nothing is selected)
  if (isFin()) h += `<button class="rrow rsum${!sel ? " sel" : ""}" data-act="select" data-id="" aria-current="${!sel}" aria-label="Run summary, 6:02" data-ftip="Run summary · 6:02">
      <span class="gw">${ic("list", "s16")}</span><span class="rbody"><span class="rl1"><span class="rt">Summary</span></span></span><span></span></button>`;
  h += `<ol class="rlist">
    <li><button class="rrow pre${sel === "pre" ? " sel" : ""}" data-act="select" data-id="pre" aria-current="${sel === "pre"}" aria-label="Before plan, ${preLab}" data-ftip="${preLab}">
      <span class="gw">${gl("pre", 24, {label:false})}</span><span class="rbody"><span class="rl1"><span class="rt">Before plan</span>
      <span class="rev"><span class="fdots" aria-hidden="true">${files.map(f => `<i class="fdot" data-tip="read ${f.target}"></i>`).join("")}<i class="tsq" data-tip="ran ls"></i></span></span></span></span><span></span>
    </button></li>`;

  ms.forEach((v, idx) => {
    const isSel = sel === v.id;
    let ev, evLab;
    if (v.status === "working" || v.status === "stopped") {
      ev = `<span class="elap"><span class="js-m3el">${fmt(S.m3Sec)}</span></span>${strip(v.actions, sec(v.start), sec(v.start) + S.m3Sec, 96, false)}`;
      evLab = `running for ${fmt(S.m3Sec)}, ${v.actions.filter(a => !a.live).length} actions`;
    } else if (v.status === "pending") {
      const unmet = v.deps.filter(d => mod(d).status !== "verified");
      const show = unmet.length ? unmet : v.deps;
      ev = `<span class="needs" data-tip="Starts after ${v.deps.join(" and ")}">${ic("needs", "s14")}needs <b>${show.join(" ")}</b></span>`;
      evLab = `needs ${show.join(" and ")}`;
    } else {
      const a = v.files.reduce((s, f) => s + f.add, 0), d = v.files.reduce((s, f) => s + f.del, 0);
      ev = `${dbar(a, d)}${pips(v.tests.pass, v.tests.fail)}`;
      evLab = `+${a} −${d} lines, ${v.tests.pass} passed, ${v.tests.fail} failed`;
      if (fl.includes(v.id)) {
        ev = `<span style="color:var(--warn-fg);display:inline-flex" data-tip="${esc(D.flag.text)}">${ic("flag", "s14")}</span>` + ev;
        evLab = "flagged, " + evLab;
      }
    }
    let dep = "<span></span>", depLab = "";
    if (redoId) {
      if (repl.includes(v.id)) { dep = `<span class="dep repl" data-tip="Attempt will be replaced">${gl("replaced", 14, {label:false})}</span>`; depLab = ", attempt will be replaced"; }
      else if (idx < redoIdx) { dep = `<span class="dep keep" data-tip="Kept">${ic("check", "s14")}</span>`; depLab = ", kept"; }
    } else if (ups.includes(v.id)) { dep = `<span class="dep up" data-tip="${sel} needs ${v.id}">${ic("up", "s14")}</span>`; depLab = `, ${sel} needs this`; }
    else if (downs.includes(v.id)) { dep = `<span class="dep down" data-tip="${v.id} needs ${sel}">${ic("down", "s14")}</span>`; depLab = `, needs ${sel}`; }

    // The button's name carries the Level 1 evidence too (status, diff, tests, dependency marker)
    const name = `${v.id} ${esc(v.title)}, ${ST_LABEL[v.status]}, ${evLab}${depLab}`;
    h += `<li><button class="rrow${isSel ? " sel" : ""}${repl.includes(v.id) ? " dim" : ""}" data-act="select" data-id="${v.id}" aria-current="${isSel}" aria-label="${name}" data-ftip="${ST_LABEL[v.status]} · ${evLab}${depLab}">
      <span class="gw">${gl(v.status, 24, {label:false})}</span><span class="rbody"><span class="rl1"><span class="rid">${v.id}</span><span class="rt">${esc(v.title)}</span></span><span class="rev">${ev}</span></span>${dep}</button></li>`;
    if (S.run === "waiting" && !S.stopped && v.id === "M3") h += `<li class="bound hold"><span class="sr">Agent is held here, after M3</span><span class="bb" aria-hidden="true">${gl("waiting", 22, {label:false})}</span><span class="bt" aria-hidden="true">held</span></li>`;
    if (pa === v.id && !S.stopped) h += `<li class="bound"><span class="sr">Agent will pause after ${v.id}</span><span class="bb" aria-hidden="true">${ic("pause", "s14")}</span><span class="bt" aria-hidden="true">after ${v.id}</span></li>`;
  });
  h += `</ol><p class="khint"><span class="sr">Keyboard: j and k move, Enter opens, Escape goes back</span>${["j", "k", "↵", "esc"].map(k => `<kbd aria-hidden="true">${k}</kbd>`).join("")}</p>`;
  $("#rail").innerHTML = h;
}

/* =========================================================
   7. RENDER: Level 2 — Module card / run summary
   ========================================================= */
function srcHtml(src) {
  const lab = src === "tests" ? "tests show" : src === "agent" ? "agent says" : "not checked yet";
  const icon = src === "tests" ? ic("flask", "s16") : src === "agent" ? ic("bubble", "s16") : '<svg class="i s16" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12h8"/></svg>';
  return `<span class="src ${src || ""}" role="img" aria-label="${lab}" data-tip="${lab}">${icon}</span>`;
}

function primaryBtn(v) {
  if (v.status === "pending") return S.stopped // same guard as the Log's "Change M4"
    ? `<button class="btn primary" aria-disabled="true" data-tip="Agent stopped">${ic("edit", "s16")}Change ${v.id}…</button>`
    : `<button class="btn primary" data-act="ed-open" data-v="change" data-id="${v.id}">${ic("edit", "s16")}Change ${v.id}…</button>`;
  if (v.status === "working") return `<button class="btn primary" data-act="ed-open" data-v="correct" data-id="${v.id}">${ic("note", "s16")}Correct ${v.id}…</button>`;
  return `<button class="btn danger" data-act="ed-open" data-v="redo" data-id="${v.id}">${ic("undo", "s16")}Redo from ${v.id}…</button>`;
}

function cardHtml(v) {
  const cur = v.instr[v.instr.length - 1];
  const verChip = `<button class="chip ver mono${cur.by === "you" ? " you" : ""}" data-act="drawer" data-id="${v.id}" data-tab="instr" aria-label="Instructions v${cur.v}, by ${cur.by}" data-tip="Instructions v${cur.v} · by ${cur.by}">${ic(cur.by === "you" ? "user" : "bot", "s14")}v${cur.v}</button>`;
  const flagged = flags().find(f => f.module === v.id);
  const t0 = v.start ? sec(v.start) : 0, t1 = v.end ? sec(v.end) : t0 + S.m3Sec;
  const editing = S.editor && S.editor.id === v.id;

  let h = `<article class="card" aria-labelledby="card-title">
    <header class="card-h">${gl(v.status, 24, {anim:false})}<span class="cid">${v.id}</span><h2 id="card-title">${esc(v.title)}</h2><span class="gap"></span>${verChip}${editing ? "" : primaryBtn(v)}</header>
    <p class="goal">${esc(v.goal)}</p>`;
  // Flag as a graphic sequence: agent says done (half glyph) · last edit → failing run. Opens the test evidence.
  if (flagged) h += `<button class="callout" data-act="drawer" data-id="${v.id}" data-tab="tests" data-v="flag" aria-label="Flag: ${esc(flagged.text)}. Open test evidence" data-tip="${esc(flagged.text)}">
      ${ic("flag")}${gl("claimed", 16, {label:false})}<span class="seq" aria-hidden="true"><span class="ic-edit">${ic("edit", "s16")}</span>${ic("arrow", "s14")}${pips(v.tests.pass, v.tests.fail, false)}</span><span class="gap"></span><span class="muted" aria-hidden="true">${ic("ext", "s16")}</span></button>`;
  if (editing) h += editorHtml(S.editor);

  // Done-when criteria
  h += `<div class="cgrid"><section class="blk"><h3 class="cap">${ic("target", "s14")}Done when</h3><ul class="crit">
    ${v.criteria.map(c => `<li>${gl(c.st, 16)}<span>${esc(c.text)}</span>${srcHtml(c.src)}</li>`).join("")}</ul></section>`;
  // Tests
  h += `<section class="blk"><h3 class="cap">${ic("flask", "s14")}Tests</h3>`;
  if (v.tests) {
    const t = v.tests, res = `${ring(t.pass, t.fail, 40)}<span class="tnum">${t.pass}<small>/${t.pass + t.fail}</small></span>`;
    const lastRun = (v.actions.filter(a => a.k === "test" && !a.live).slice(-1)[0] || {}).t;
    // One test graphic (ring + number). While a new run is going, the last result is dimmed as stale.
    h += v.status === "working"
      ? `<div class="trow"><span class="stale" data-tip="Previous run · ${lastRun}">${res}<span class="sr">previous run</span></span>
         <span class="livet" data-tip="pytest running now">${gl("working", 22, {anim:false, label:"new test run in progress"})}</span></div>`
      : `<div class="trow">${res}</div>`;
  } else h += `<div class="trow">${pips(0, 0, false)}${none("no test runs yet")}</div>`;
  h += `</section>`;
  // Files changed
  h += `<section class="blk"><h3 class="cap">${ic("diff", "s14")}Files</h3>`;
  h += v.files.length ? v.files.map(f => `<div class="frow">${ic("file", "s16")}<span class="mono" title="${f.path}">${f.path}</span>${dbar(f.add, f.del, false)}${dnum(f.add, f.del)}
      <button class="mini" data-act="drawer" data-id="${v.id}" data-tab="diff" data-file="${f.path}" aria-label="Open diff of ${f.path}" data-tip="Open diff">${ic("ext", "s16")}</button></div>`).join("")
    : none("no files changed");
  h += `</section>`;
  // Looked at
  h += `<section class="blk"><h3 class="cap">${ic("eye", "s14")}Read</h3>`;
  h += v.looked.length ? `<div class="chips">${v.looked.map(f => `<span class="chip">${ic("file", "s14")}<span class="mono">${f}</span></span>`).join("")}</div>` : none("nothing read");
  h += `</section></div>`;
  // Activity
  h += `<div class="actblk"><h3 class="cap">${ic("pulse", "s14")}Activity</h3>`;
  h += v.actions.length ? `<div class="stripw"><span class="mono">0:00</span>${strip(v.actions, t0, t1, 300, true)}<span class="mono${v.status === "working" ? " js-m3el" : ""}">${v.start ? elapsed(v) : ""}</span></div>`
    : `<div class="stripw">${none("no activity yet")}</div>`;
  h += `<button class="btn" data-act="drawer" data-id="${v.id}" data-tab="actions"${v.actions.length ? "" : ' aria-disabled="true"'}>${ic("list", "s16")}Evidence<span class="mono muted">${v.actions.length}</span></button></div></article>`;
  return h;
}

function preCardHtml() {
  const acts = D.pre.actions;
  return `<article class="card" aria-labelledby="card-title">
    <header class="card-h">${gl("pre", 24)}<h2 id="card-title">Before plan</h2><span class="gap"></span></header>
    <p class="goal">${esc(D.task)}</p>
    <div class="cgrid"><section class="blk"><h3 class="cap">${ic("eye", "s14")}Read</h3><div class="chips">${acts.filter(a => a.k === "read").map(a => `<span class="chip">${ic("file", "s14")}<span class="mono">${a.target}</span></span>`).join("")}</div></section>
    <section class="blk"><h3 class="cap">${ic("term", "s14")}Ran</h3><div class="chips"><span class="chip">${ic("term", "s14")}<span class="mono">ls</span></span></div></section></div>
    <div class="actblk"><h3 class="cap">${ic("pulse", "s14")}Activity</h3><div class="stripw"><span class="mono">0:00</span>${strip(acts, 0, 22, 300, true)}<span class="mono">0:22</span></div>
    <button class="btn" data-act="drawer" data-id="pre" data-tab="actions">${ic("list", "s16")}Evidence<span class="mono muted">${acts.length}</span></button></div></article>`;
}

function summaryHtml() {
  const ms = mods();
  const tot = {};
  ms.forEach(v => v.files.forEach(f => { tot[f.path] = tot[f.path] || {add:0, del:0}; tot[f.path].add += f.add; tot[f.path].del += f.del; }));
  const ta = Object.values(tot).reduce((s, f) => s + f.add, 0), td = Object.values(tot).reduce((s, f) => s + f.del, 0);
  const rows = ms.map(v => {
    const a = v.files.reduce((s, f) => s + f.add, 0), d = v.files.reduce((s, f) => s + f.del, 0);
    return `<tr data-act="select" data-id="${v.id}"><td>${gl(v.status, 20)}</td><td class="mono muted">${v.id}</td>
      <td><button class="linkbtn" data-act="select" data-id="${v.id}">${esc(v.title)}</button></td>
      <td>${dbar(a, d)} ${dnum(a, d)}</td><td>${v.tests ? pips(v.tests.pass, v.tests.fail) + ` <span class="mono muted">${v.tests.pass}/${v.tests.pass + v.tests.fail}</span>` : ""}</td>
      <td class="mono muted">${elapsed(v)}</td></tr>`;
  }).join("");
  const n = S.interventions;
  return `<article class="card" aria-labelledby="card-title">
    <header class="card-h">${gl("verified", 24, {label:"run finished"})}<h2 id="card-title">Run summary</h2><span class="gap"></span><span class="mono muted" style="display:inline-flex;gap:6px;align-items:center">${ic("clock", "s14")}6:02</span></header>
    <p class="goal">${esc(D.task)}</p>
    <table class="sum"><caption class="sr">Modules in this run</caption><tbody>${rows}</tbody></table>
    <div class="sumfoot">
      <span class="stat" role="img" aria-label="${Object.keys(tot).length} files, +${ta} −${td} lines">${ic("diff", "s16")}<span class="mono">${Object.keys(tot).length}</span>${ic("file", "s14")}${dbar(ta, td, false)}${dnum(ta, td)}</span>
      <button class="stat flag" data-act="select" data-id="${D.flag.module}" aria-label="1 flag: ${esc(D.flag.text)}" data-tip="${esc(D.flag.text)}">${ic("flag", "s16")}<span class="mono">${D.flag.module}</span>${gl("unverified", 16, {label:false})}</button>
      <span class="stat">${ic("user", "s16")}Interventions <span class="mono">${n ? n : "none"}</span></span>
    </div></article>`;
}

function renderCard() {
  const el = $("#cardpane");
  if (!S.sel) el.innerHTML = summaryHtml();
  else if (S.sel === "pre") el.innerHTML = preCardHtml();
  else el.innerHTML = cardHtml(mod(S.sel));
}

/* =========================================================
   8. RENDER: inline editors (change / correct / redo + consequence preview)
   ========================================================= */
function editorHtml(e) {
  const v = mod(e.id), cur = v.instr[v.instr.length - 1];
  if (e.type === "change") {
    const k = "change-" + e.id, val = S.drafts[k] != null ? S.drafts[k] : cur.text;
    return `<div class="ed" role="group" aria-labelledby="ed-h">
      <h3 id="ed-h">${ic("edit", "s16")}Change ${e.id} · v${cur.v + 1}</h3>
      <label for="ed-text">${ic("clock", "s14")}<span class="sr">Takes effect </span>when ${e.id} starts</label>
      <textarea id="ed-text" data-draft="${k}">${esc(val)}</textarea>
      <div class="acts"><button class="btn" data-act="ed-cancel">Cancel</button><button class="btn primary" data-act="change-save" data-id="${e.id}">${ic("check", "s16")}Save v${cur.v + 1}</button></div></div>`;
  }
  if (e.type === "correct") {
    const k = "correct-" + e.id;
    return `<div class="ed" role="group" aria-labelledby="ed-h">
      <h3 id="ed-h">${ic("note", "s16")}Correct ${e.id}</h3>
      <label for="ed-line">${ic("clock", "s14")}<span class="sr">Reaches the agent </span>after pytest</label>
      <input id="ed-line" class="inp" data-draft="${k}" value="${esc(S.drafts[k] || "")}" placeholder="e.g. Round half up; do not truncate" autocomplete="off">
      <div class="acts"><button class="btn" data-act="ed-cancel">Cancel</button><button class="btn primary" data-act="correct-send" data-id="${e.id}">${ic("send", "s16")}Send</button></div></div>`;
  }
  return redoHtml(e);
}

function redoHtml(e) {
  const id = e.id, v = mod(id), cur = v.instr[v.instr.length - 1];
  const idx = D.modules.findIndex(m => m.id === id);
  const repl = attemptsFrom(id);
  const kept = D.modules.slice(0, idx).map(m => m.id);
  const files = [...new Set(repl.flatMap(r => r.files.map(f => f.path)))];
  const running = S.run === "working" && !S.stopped;
  const ki = "redo-instr-" + id, kn = "redo-note-" + id;
  const instr = S.drafts[ki] != null ? S.drafts[ki] : cur.text;
  const note = S.drafts[kn] != null ? S.drafts[kn] : "";
  // conversation mini timeline: before-plan + each started module; cut marker before the redo module
  const started = mods().filter(x => x.status !== "pending");
  let tl = "", lab = "";
  [{id:"pre"}].concat(started).forEach(sg => {
    const gone = sg.id !== "pre" && D.modules.findIndex(m => m.id === sg.id) >= idx;
    const w = sg.id === "pre" ? 18 : 30;
    if (sg.id === id) { tl += '<i class="cut"></i>'; lab += '<span style="width:8px"></span>'; }
    tl += `<span class="${gone ? "gone" : ""}" style="width:${w}px"></span>`;
    lab += `<span style="width:${w}px">${sg.id === "pre" ? "·" : sg.id}</span>`;
  });
  return `<section class="ed redo" aria-labelledby="redo-h">
    <h3 id="redo-h">${ic("undo", "s16")}Redo from ${id}</h3>
    <div class="redo-cols">
      <div>
        <label for="redo-instr">${ic("file", "s14")}Instructions for ${id} · v${cur.v + 1}</label>
        <textarea id="redo-instr" data-draft="${ki}">${esc(instr)}</textarea>
        <label for="redo-note" style="margin-top:12px">${ic("bubble", "s14")}What went wrong <span>(optional)</span></label>
        <input id="redo-note" class="inp" data-draft="${kn}" value="${esc(note)}" autocomplete="off">
      </div>
      <ul class="cq" aria-label="What will happen">
        <li><span class="cqi">${ic("undo", "s16")}</span><div><div class="cqt">Restored</div><div class="chips">${files.length ? files.map(f => `<span class="chip"><span class="ri">${ic("file", "s14")}${ic("undo", "s14")}</span><span class="mono">${f}</span></span>`).join("") : none("no files to restore")}</div></div></li>
        <li><span class="cqi">${ic("rewind", "s16")}</span><div><div class="cqt">Rewound</div>
          <div class="tl" role="img" aria-label="Conversation kept up to the start of ${id}; later turns removed">${tl}</div><div class="tl-lab" aria-hidden="true">${lab}</div></div></li>
        <li><span class="cqi">${gl("replaced", 16, {label:false})}</span><div><div class="cqt">Replaced</div><div class="chips">${repl.map(r => `<span class="chip strike"><span class="mono">${r.id}</span> attempt 1</span>`).join("")}</div></div></li>
        <li><span class="cqi">${gl("verified", 16, {label:false})}</span><div><div class="cqt">Kept</div><div class="chips">${kept.length ? kept.map(k => `<span class="chip ok">${ic("check", "s14")}<span class="mono">${k}</span></span>`).join("") : none("nothing kept")}</div></div></li>
        <li><span class="cqi${running ? " stopi" : ""}">${ic("stop", "s16")}</span><div><div class="cqt">Agent</div><span>${running ? "Will be stopped now" : "Idle · nothing to stop"}</span></div></li>
      </ul>
    </div>
    <div class="acts"><button class="btn" data-act="ed-cancel">Cancel</button><button class="btn danger-solid" data-act="redo-confirm" data-id="${id}">${ic("undo", "s16")}${running ? "Stop &amp; redo" : "Redo"} from ${id}</button></div>
  </section>`;
}

/* =========================================================
   9. RENDER: Level 3 — Evidence drawer
   ========================================================= */
const KIND_IC = {read:["eye", "ic-read"], edit:["edit", "ic-edit"], bash:["term", "ic-bash"], test:["flask", "ic-test"]};
function actRow(a, v, sub) {
  const [n, c] = KIND_IC[a.k];
  const icon = `<span class="${c}" role="img" aria-label="${a.k}">${ic(n, "s16")}</span>`;
  let lbl, res = "", act = "";
  if (a.k === "read") { lbl = `<span class="mono">${a.target}</span>`; res = `<span class="badge" role="img" aria-label="ok">${ic("check", "s14")}</span>`; }
  if (a.k === "bash") { lbl = `<span class="mono">$ ${a.target}</span>`; res = `<span class="badge">exit 0</span>`; }
  if (a.k === "edit") { lbl = `${a.verb} <span class="mono">${a.target}</span>`; res = `${dbar(a.add, a.del, false)}${dnum(a.add, a.del)}`; act = `data-act="open-diff" data-id="${v.id}" data-file="${a.target}"`; }
  if (a.k === "test") {
    lbl = `<span class="mono">pytest</span>`; act = `data-act="tab" data-tab="tests"`;
    res = a.live ? `<span class="badge live">${gl("working", 14, {anim:false})}running</span>`
      : `${pips(a.pass, a.fail, false)}<span class="badge ${a.fail ? "bad" : "ok"}">${a.pass}/${a.pass + a.fail}</span>`;
  }

    p = p < 0 ? (dir > 0 ? 0 : rows.length - 1) : Math.max(0, Math.min(rows.length - 1, p + dir));
    S.log.sel = rows[p].i; render();
    focusSel(`[data-act="log-row"][data-i="${S.log.sel}"]`);
  }
}
function openLevel() {
  if (S.view === "modules") {
    if (!S.sel) { select("M1"); focusSel(railSel("M1")); return; }
    S.drawer = {id:S.sel, tab:"actions"}; S.returnKey = railKey(S.sel);
    render(); focusSel('[data-act="drawer-close"]');
  } else if (S.log.sel >= 0) { S.log.open[S.log.sel] = !S.log.open[S.log.sel]; render(); }
}

/* =========================================================
   13. EVENTS (one delegated handler per event type)
   ========================================================= */
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-act]");
  if (!t || t.getAttribute("aria-disabled") === "true") return;
  const a = t.dataset.act, id = t.dataset.id, v = t.dataset.v;
  switch (a) {
    case "m-state": setRun(v); break;
    case "m-view":
      S.view = v; S.drawer = null; S.stopAsk = false;
      if (v === "modules" && S.editor) S.sel = S.editor.id; // an editor opened in the Log shows on its module's card
      render(); break;
    case "m-theme": S.theme = v; render(); break;
    case "select": select(id || null); if (t.closest("#rail")) focusSel(railSel(id)); break;
    case "flag-jump":
      if (S.view === "log") { S.log.flagged = true; render(); }
      else select(D.flag.module);
      break;
    case "drawer":
      S.returnKey = keyOf(t); S.drawer = {id, tab:t.dataset.tab || "actions", file:t.dataset.file};
      render(); focusSel('[data-act="drawer-close"]'); break;
    case "drawer-close": S.drawer = null; render(); restoreReturn(); break;
    case "tab": S.drawer.tab = t.dataset.tab; S.drawer.file = null; render(); focusSel(`#tab-${t.dataset.tab}`); break;
    case "open-diff": S.drawer = {id, tab:"diff", file:t.dataset.file}; render(); focusSel("#tab-diff"); break;
    case "fold": S.folds[v] = !S.folds[v]; render(); break;
    case "pause":
      S.pause = !S.pause;
      toast(S.pause ? `Agent will pause after ${pauseAfter()}` : "Pause cleared", S.pause ? "pause" : "check");
      render(); break;
    case "note": S.noteOpen = !S.noteOpen; S.stopAsk = false; render(); if (S.noteOpen) focusSel("#note-in"); break;
    case "note-send": sendNote(); break;
    case "stop": S.stopAsk = true; S.noteOpen = false; render(); focusSel('[data-act="stop-cancel"]'); break;
    case "stop-cancel": S.stopAsk = false; render(); focusSel('[data-act="stop"]'); break;
    case "stop-confirm":
      S.stopAt = S.run === "waiting" ? fmt(sec(D.modules[2].end) + S.waitSec) : fmt(S.runSec);
      S.stopAsk = false; S.stopped = true; S.pause = false; S.editor = null; S.noteOpen = false;
      toast("Agent stopped · files left as they are", "stop"); render(); focusSel("#now-title"); break;
    case "ed-open": openEditor(v, id, undefined, t); break;
    case "ed-cancel": closeEditor(); render(); afterEditor(); break;
    case "change-save": {
      const cur = mod(id).instr.slice(-1)[0], k = "change-" + id;
      const text = (S.drafts[k] != null ? S.drafts[k] : cur.text).trim() || cur.text;
      S.instrExtra[id] = (S.instrExtra[id] || []).concat({v:cur.v + 1, by:"you", text});
      delete S.drafts[k]; S.interventions++; closeEditor();
      toast(`${id} instructions saved as v${cur.v + 1} · used when ${id} starts`); render(); afterEditor(); break;
    }
    case "correct-send": {
      const k = "correct-" + id, val = (S.drafts[k] || "").trim();
      if (!val) { focusSel("#ed-line"); break; }
      delete S.drafts[k]; S.interventions++; closeEditor();
      toast(`Correction queued · reaches ${id} after pytest`, "send"); render(); afterEditor(); break;
    }
    case "redo-confirm": {
      const running = S.run === "working" && !S.stopped;
      closeEditor(); S.interventions++;
      toast(`${running ? "Agent stopped · " : ""}Redo from ${id} started (mockup)`, "undo"); render(); afterEditor(); break;
    }
    case "continue": toast("Continuing to M4 · mockup jumps to the finished run", "play"); setRun("finished", true); break;
    case "change-next": openEditor("change", "M4", undefined, t); break;
    case "redo-cur": openEditor("redo", "M3", undefined, t); break;
    case "log-mod": S.log.mod = v; render(); break;
    case "log-type": S.log.types[v] = !S.log.types[v]; render(); break;
    case "log-flag": S.log.flagged = !S.log.flagged; render(); break;
    case "log-row": { const i = +t.dataset.i; S.log.sel = i; S.log.open[i] = !S.log.open[i]; render(); break; }
    case "log-change": openEditor("change", id, +t.dataset.i, t); break;
    case "log-correct": openEditor("correct", id, +t.dataset.i, t); break;
    case "log-redo": openEditor("redo", id, +t.dataset.i, t); break;
  }
});

document.addEventListener("input", ev => {
  const d = ev.target.dataset && ev.target.dataset.draft;
  if (d) S.drafts[d] = ev.target.value;
  if (ev.target.id === "log-q") { S.log.q = ev.target.value; renderLogList(); }
});

document.addEventListener("keydown", ev => {
  const t = ev.target, typing = t.tagName === "INPUT" || t.tagName === "TEXTAREA";
  if (ev.key === "Escape") { if (typing) t.blur(); ev.preventDefault(); escape(); return; }
  if (typing) {
    if (ev.key === "Enter" && t.id === "note-in") { ev.preventDefault(); sendNote(); }
    if (ev.key === "Enter" && t.id === "ed-line") { ev.preventDefault(); $('[data-act="correct-send"]').click(); }
    return;
  }
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (t.getAttribute && t.getAttribute("role") === "tab" && (ev.key === "ArrowRight" || ev.key === "ArrowLeft")) {
    const tabs = [...document.querySelectorAll('#drawer [role="tab"]')], i = tabs.indexOf(t);
    const n = tabs[(i + (ev.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length];
    if (n) { ev.preventDefault(); n.click(); }
    return;
  }
  if (ev.key === "j" || ev.key === "k") { ev.preventDefault(); move(ev.key === "j" ? 1 : -1); return; }
  if (ev.key === "Enter") {
    const onRow = t.closest && t.closest("#rail [data-act='select']");
    if (onRow && (onRow.dataset.id || null) === S.sel) { ev.preventDefault(); openLevel(); return; }
    if (t === document.body || !t.closest("button, a, input, textarea, [tabindex]")) { ev.preventDefault(); openLevel(); }
    return;
  }
  if (["1", "2", "3", "4"].includes(ev.key)) setRun(["working", "waiting", "finished", "redo"][+ev.key - 1]);
});

// Tooltips on hover AND keyboard focus. data-tip = hover + focus; data-ftip = focus only (rail rows,
// whose parts already have hover tips). The tip is hoverable (stays while the pointer is over it),
// dismissable with Esc, and linked to the focused element with aria-describedby.
let tipEl = null, tipTimer = 0;
function showTip(el, text) {
  if (!text) return;
  clearTimeout(tipTimer);
  if (tipEl && tipEl !== el) tipEl.removeAttribute("aria-describedby");
  if (text === "legend") tip.innerHTML = LEGEND; else tip.textContent = text;
  tip.hidden = false; tipEl = el;
  if (el === document.activeElement && text !== el.getAttribute("aria-label")) el.setAttribute("aria-describedby", "tip");
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  const x = Math.max(8, Math.min(r.left + r.width / 2 - tw / 2, innerWidth - tw - 8));
  let y = r.bottom + 6; if (y + th > innerHeight - 8) y = r.top - th - 6;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip(now) {
  clearTimeout(tipTimer);
  const go = () => { tip.hidden = true; if (tipEl) { tipEl.removeAttribute("aria-describedby"); tipEl = null; } };
  if (now) go(); else tipTimer = setTimeout(go, 150);
}
document.addEventListener("mouseover", ev => {
  if (!ev.target.closest) return;
  if (ev.target.closest("#tip")) { clearTimeout(tipTimer); return; }
  const el = ev.target.closest("[data-tip]");
  if (el) showTip(el, el.dataset.tip); else hideTip();
});
document.addEventListener("focusin", ev => {
  const el = ev.target.closest && ev.target.closest("[data-tip],[data-ftip]");
  if (el && ev.target.matches(":focus-visible")) showTip(el, el.dataset.tip || el.dataset.ftip); else hideTip(true);
});
document.addEventListener("focusout", () => hideTip(true));
document.addEventListener("scroll", () => hideTip(true), true);

// Live clocks (text only; the working glyph is the only animation)
setInterval(() => {
  if (S.stopped) return;
  if (S.run === "working") {
    S.runSec++; S.m3Sec++;
    document.querySelectorAll(".js-m3el").forEach(n => { n.textContent = fmt(S.m3Sec); });
  } else if (S.run === "waiting") {
    S.waitSec++;
    document.querySelectorAll(".js-wait").forEach(n => { n.textContent = fmt(S.waitSec); });
  }
}, 1000);

render();
</script>
</body>
