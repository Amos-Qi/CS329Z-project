<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Observation Panel</title>
<meta name="description" content="Clickable mockup, direction B (metro line): observation panel for one pi coding agent working in modules.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ---------- Tokens: dark (default) ---------- */
:root{
  --bg:#0F172A; --card:#1B2336; --muted:#272F42; --border:#475569;
  --control-border:#64748B; --ctl-on-warn:#8B7A57;
  --hair:rgba(148,163,184,.16); --hair-2:rgba(148,163,184,.30);
  /* --primary: filled surface of secondary (neutral) buttons; --btn-bg is the high-emphasis primary action */
  --fg:#F8FAFC; --fg-2:#CBD5E1; --muted-fg:#94A3B8; --primary:#1E293B;
  --ok:#22C55E; --ok-fg:#4ADE80; --ok-soft:rgba(34,197,94,.14); --on-ok:#0F172A;
  --warn:#F59E0B; --warn-fg:#FBBF24; --warn-soft:rgba(245,158,11,.14); --warn-surface:#33291A; --warn-solid:#F59E0B; --warn-solid-h:#FBBF24; --on-warn:#0F172A;
  --bad:#EF4444; --bad-fg:#F87171; --bad-soft:rgba(239,68,68,.14); --bad-solid:#DC2626; --on-bad:#FFFFFF;
  --act:#60A5FA; --act-fg:#93C5FD; --act-soft:rgba(96,165,250,.16);
  --pend:#94A3B8; --pend-line:#64748B; --run:#A78BFA;
  --add-bg:rgba(34,197,94,.13); --del-bg:rgba(239,68,68,.15); --add-fg:#86EFAC; --del-fg:#FCA5A5;
  --focus:#93C5FD; --btn-bg:#F8FAFC; --btn-bg-h:#E2E8F0; --btn-fg:#0F172A;
  --tip-bg:#272F42; --shadow:0 10px 30px rgba(2,6,23,.55);
  --mock-bg:#E2E8F0; --mock-fg:#0F172A; --mock-sub:rgba(15,23,42,.10);
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
}
/* ---------- Tokens: light (re-tuned, not inverted) ---------- */
[data-theme="light"]{
  --bg:#F3F5F9; --card:#FFFFFF; --muted:#EBEFF5; --border:#64748B;
  --control-border:#64748B; --ctl-on-warn:#64748B;
  --hair:rgba(15,23,42,.09); --hair-2:rgba(15,23,42,.16);
  --fg:#0F172A; --fg-2:#334155; --muted-fg:#475569; --primary:#E2E8F0;
  --ok:#15803D; --ok-fg:#166534; --ok-soft:#DCFCE7; --on-ok:#FFFFFF;
  --warn:#B45309; --warn-fg:#92400E; --warn-soft:#FEF3C7; --warn-surface:#FEF3C7; --warn-solid:#B45309; --warn-solid-h:#92400E; --on-warn:#FFFFFF;
  --bad:#DC2626; --bad-fg:#B91C1C; --bad-soft:#FEE2E2; --bad-solid:#B91C1C; --on-bad:#FFFFFF;
  --act:#2563EB; --act-fg:#1D4ED8; --act-soft:#DBEAFE;
  --pend:#64748B; --pend-line:#7B8BA1; --run:#7C3AED;
  --add-bg:#DCFCE7; --del-bg:#FEE2E2; --add-fg:#166534; --del-fg:#991B1B;
  --focus:#2563EB; --btn-bg:#0F172A; --btn-bg-h:#1E293B; --btn-fg:#FFFFFF;
  --tip-bg:#FFFFFF; --shadow:0 8px 24px rgba(15,23,42,.14);
  --mock-bg:#1E293B; --mock-fg:#F8FAFC; --mock-sub:rgba(248,250,252,.12);
  color-scheme:light;
}
/* ---------- Base ---------- */
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-padding-top:calc(var(--now-h,64px) + 8px);scroll-padding-bottom:calc(var(--mock-h,56px) + 8px)}
body{background:var(--bg);color:var(--fg);font:400 14px/1.45 var(--font-ui);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
.mono{font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.i{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.g{flex:none;display:block}
.muted{color:var(--muted-fg)}
.spacer{flex:1}
[hidden]{display:none!important}

/* ---------- Buttons ---------- */
.ib{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:6px;color:var(--fg-2);border:1px solid transparent;transition:background-color .15s,color .15s,border-color .15s;position:relative}
.ib:hover{background:var(--muted);color:var(--fg)}
.ib[aria-pressed="true"]{background:var(--warn-soft);color:var(--warn-fg);border-color:var(--warn)}
.ib.danger{color:var(--bad-fg)}
.ib.danger:hover{background:var(--bad-soft)}
.ib[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.ib[aria-disabled="true"]:hover{background:none}
.ib .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--act);box-shadow:0 0 0 2px var(--card)}
.ib.sm{width:32px;height:32px}
.now.waiting .ib .dot{box-shadow:0 0 0 2px var(--warn-surface)}
.btn{height:32px;padding:0 12px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:14px;border:1px solid var(--control-border);background:var(--primary);color:var(--fg);white-space:nowrap;transition:background-color .15s,border-color .15s,opacity .15s}
.btn:hover{background:var(--muted)}
.btn.primary{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.btn.primary:hover{background:var(--btn-bg-h);border-color:var(--btn-bg-h)}
.btn.warn{background:var(--warn-solid);color:var(--on-warn);border-color:var(--warn-solid)}
.btn.warn:hover{background:var(--warn-solid-h);border-color:var(--warn-solid-h)}
.btn.danger{background:var(--bad-solid);color:var(--on-bad);border-color:var(--bad-solid)}
.btn.danger:hover{opacity:.9}
.btn.dghost{color:var(--bad-fg);border-color:var(--bad);background:transparent}
.btn.dghost:hover{background:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg-2)}
.btn.ghost:hover{background:var(--muted)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:4px;background:var(--muted);color:var(--fg-2);font-size:12px;white-space:nowrap;max-width:100%}
.chip.lnk{cursor:pointer;transition:background-color .15s}
.chip.lnk:hover{background:var(--hair-2)}
.chip.struck{text-decoration:line-through;text-decoration-color:var(--bad-fg);color:var(--muted-fg);background:transparent;border:1px dashed var(--pend-line)}
.chip.keep{background:var(--ok-soft);color:var(--fg)}
.chip.keep .i{color:var(--ok-fg)}

/* ---------- Now bar (level 0) ---------- */
.now{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:64px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--hair-2);transition:background-color .2s}
.now.waiting{background:var(--warn-surface);border-bottom:2px solid var(--warn)}
.now.waiting .dc-acts > .btn:not(.warn):not(.danger):not(.dghost){background:transparent;border-color:var(--ctl-on-warn)}
.now.waiting .dc-acts > .btn:not(.warn):not(.danger):not(.dghost):hover{background:var(--warn-soft)}
.now.waiting .dc-acts > .btn.dghost:hover,.now.waiting .dc-acts > .ctl > .btn.dghost:hover{background:var(--bad-solid);color:var(--on-bad);border-color:var(--bad-solid)}
.now-state{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto}
.now-title{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.now-title .k{color:var(--muted-fg);font-weight:400}
.now-title .mono{font-size:14px;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--muted);color:var(--fg-2);white-space:nowrap}
.pill.flag{background:var(--warn-soft);color:var(--warn-fg);border:1px solid var(--warn);cursor:pointer}
.pill.armed{background:transparent;border:1px solid var(--warn);color:var(--warn-fg)}
.prog{display:flex;align-items:center;gap:10px}
.seg{display:flex;gap:3px;padding:7px 0;margin:-7px 0}
/* segment shapes: verified = full fill · unverified = left half filled · working = hollow + centre dot · pending = hollow · replaced = dashed + red slash · stopped = hollow + centre square */
.s{width:28px;height:10px;border-radius:2px;border:1.5px solid var(--pend-line);position:relative;overflow:hidden;display:block}
.s::after{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:currentColor}
.s.verified{border-color:var(--ok);color:var(--ok)} .s.verified::after{width:100%}
.s.unverified{border-color:var(--warn);color:var(--warn)} .s.unverified::after{width:50%;box-shadow:1.5px 0 0 var(--card)}
.s.working{border-color:var(--act);color:var(--act)} .s.working::after{left:50%;top:50%;bottom:auto;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%}
.s.replaced{border-style:dashed;border-color:var(--pend)} .s.replaced::after{left:calc(50% - 1px);top:-6px;bottom:-6px;width:2px;background:var(--bad);transform:rotate(68deg)}
.s.stopped{border-color:var(--bad);color:var(--bad)} .s.stopped::after{left:50%;top:50%;bottom:auto;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:1px}
.now.waiting .s.unverified::after{box-shadow:1.5px 0 0 var(--warn-surface)}
.now.waiting .s.pending{border-color:var(--ctl-on-warn)}
.next{display:inline-flex;align-items:center;gap:5px;color:var(--muted-fg);font-size:12px;padding:4px 0;margin:-4px 0}
.next .mono{color:var(--fg-2)}
.ctls{display:flex;align-items:center;gap:4px;margin-left:auto}
.ctl{position:relative}
.vsep{width:1px;height:24px;background:var(--hair-2);margin:0 6px;flex:none}
.dc-title{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600}
.dc-what{display:flex;align-items:center;gap:6px;color:var(--fg-2)}
.dc-acts{display:flex;align-items:center;gap:8px;flex:1 1 100%;padding-left:34px;flex-wrap:wrap}
.dc-ctl{display:flex;align-items:center;gap:4px;margin-left:auto}

/* ---------- Popovers / tooltip / toast ---------- */
.pop{position:absolute;top:calc(100% + 8px);right:0;z-index:40;width:340px;background:var(--card);border:1px solid var(--hair-2);border-radius:8px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:10px;color:var(--fg)}
.pop h3{margin:0;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.pop .row{display:flex;gap:8px;justify-content:flex-end}
.when{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted-fg)}
.field{width:100%;height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--control-border);background:var(--bg);color:var(--fg)}
textarea.field{height:auto;padding:8px 10px;resize:vertical;line-height:1.45}
.field:focus{outline:2px solid var(--focus);outline-offset:1px}
.frow-in{display:flex;gap:8px}
.nq{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:min(32vh,220px);overflow-y:auto;overscroll-behavior:contain}
.nq li{display:flex;align-items:center;gap:8px;min-height:28px;padding:4px 8px;border-radius:6px;border:1px solid var(--hair);background:var(--bg);font-size:12px}
.nq .i{color:var(--act-fg);flex:none}
.nq .tag{flex:none}
.nq .nt{flex:1;min-width:0;overflow-wrap:anywhere}
.nq .tm{color:var(--muted-fg);flex:none}
#tip{position:fixed;z-index:80;max-width:300px;padding:6px 9px;border-radius:6px;background:var(--tip-bg);color:var(--fg);border:1px solid var(--hair-2);box-shadow:var(--shadow);font-size:12px;line-height:1.4}
#tip .lg{display:grid;grid-template-columns:14px auto;gap:4px 8px;align-items:center;margin-top:2px}
.toast{position:fixed;right:16px;bottom:76px;z-index:60;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:8px;background:var(--card);border:1px solid var(--hair-2);box-shadow:var(--shadow);font-size:14px;max-width:calc(100vw - 32px);pointer-events:none}
.toast .i{color:var(--ok-fg)}

/* ---------- Metro line (level 1) ---------- */
.metro{position:relative;padding:44px 20px 14px;border-bottom:1px solid var(--hair)}
.metro-svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:0}
.ln{fill:none;stroke-width:4;stroke-linecap:round;transition:opacity .2s,stroke .2s}
.ln.done{stroke:var(--fg-2)}
.ln.future{stroke:var(--pend-line);stroke-dasharray:2 7;stroke-width:3.5}
.ln.pre{stroke:var(--pend-line);stroke-width:2;stroke-dasharray:1 5}
.ln.term{stroke:var(--fg-2);stroke-width:4}
.ln.hl{stroke:var(--fg);stroke-width:4.5}
.ln.dimln{stroke-width:2.5}
.ln.gone{stroke:var(--bad);stroke-dasharray:5 6;stroke-width:3;opacity:.8}
.arw{fill:none;stroke:var(--fg);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stations{position:relative;z-index:1;display:grid;grid-template-columns:.62fr repeat(4,minmax(0,1fr))}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;padding:0 4px 4px;border-radius:8px;transition:background-color .15s}
.st:hover .st-dot{background:var(--muted)}
.st-dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--bg);position:relative;z-index:1;transition:background-color .15s,box-shadow .15s}
.st-lab .i{display:inline-block;vertical-align:-2px;color:var(--muted-fg)}
.st[aria-current="true"] .st-dot{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--fg)}
/* related modules (upstream/downstream of the selection) get brighter labels; nothing is faded below 3:1 */
.st.rel .st-lab{color:var(--fg-2)}
.st.dim .st-lab .mono{color:var(--muted-fg)}
.st-lab{font-size:12px;color:var(--muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.st-lab .mono{color:var(--fg-2);font-weight:500;margin-right:4px}
.st[aria-current="true"] .st-lab,.st[aria-current="true"] .st-lab .mono{color:var(--fg)}
.st-ev{display:flex;flex-direction:column;align-items:center;gap:5px;min-height:14px;font-size:12px;color:var(--muted-fg)}
.st-ev.struck .pips{position:relative}
.st-ev.struck .pips::after{content:"";position:absolute;left:-3px;right:-3px;top:50%;height:1.5px;margin-top:-.75px;background:var(--bad-fg)}
.st .fl{position:absolute;top:-4px;right:-6px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--warn-solid);color:var(--on-warn)}
/* markers live in DOM order between stations (tab order = visual order); drawMetro() sets left/top */
.mk{position:absolute;z-index:2;transform:translate(-50%,-50%);display:grid;place-items:center}
/* the train is a capsule docked on the INCOMING side of the M3 platform (touching its ring), so it never reads as heading to M4 */
.train{width:34px;height:24px;border-radius:6px}
.train i{display:block;width:28px;height:10px;border-radius:5px;background:var(--act);position:relative;animation:train 2.4s ease-in-out infinite alternate}
.train i::before,.train i::after{content:"";position:absolute;top:3px;width:4px;height:4px;border-radius:1px;background:var(--bg)}
.train i::before{left:7px}.train i::after{left:15px}
@keyframes train{from{transform:translateX(-4px)}to{transform:translateX(0)}}
.mk.held{width:28px;height:28px;border-radius:6px}
/* unarmed boundary: no visible mark at rest (the shared Now-bar toggle is the main control); the octagon shows on hover/focus */
.bnd,.mk.on{width:30px;height:30px;border-radius:50%}
.bnd .o-on{display:none}
.bnd:hover .o-on,.bnd:focus-visible .o-on{display:block}
.cutline{position:absolute;z-index:2;width:0;height:72px;margin-top:-46px;border-left:2px dashed var(--bad);transform:translateX(-1px)}
.cutmk{width:26px;height:26px;border-radius:50%;background:var(--bg);border:1.5px solid var(--bad);color:var(--bad-fg)}
.spin{transform-box:view-box;transform-origin:50% 50%;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Evidence graphics ---------- */
.db{display:inline-flex;gap:2px;vertical-align:middle;align-items:center}
.db i{width:7px;height:7px;border-radius:1px;background:var(--pend-line);display:block}
.db i.a{background:var(--ok)} .db i.d{background:var(--bad)}
.dn{font-family:var(--font-mono);font-size:12px;white-space:nowrap}
.dn .p{color:var(--ok-fg)} .dn .m{color:var(--bad-fg)} .dn .z{color:var(--muted-fg)}
.pips{display:inline-flex;gap:3px;align-items:center;vertical-align:middle;flex-wrap:nowrap}
.pp{width:7px;height:7px;border-radius:50%;background:var(--ok);display:block}
.pf{width:9px;height:9px;position:relative;display:block}
.pf::before,.pf::after{content:"";position:absolute;left:3.5px;top:-.5px;width:2px;height:10px;border-radius:1px;background:var(--bad);transform:rotate(45deg)}
.pf::after{transform:rotate(-45deg)}
.pl{width:8px;height:8px;border-radius:50%;border:2px solid var(--act);display:block}
.tn{font-family:var(--font-mono);font-size:12px;color:var(--fg-2)}
.strip{display:inline-flex;align-items:flex-end;gap:3px;height:24px;padding:5px;margin:-5px;box-sizing:border-box}
.t{width:3px;border-radius:1px;display:block}
.t-read{height:6px;background:var(--pend)}
.t-edit{height:14px;background:var(--act)}
.t-bash{height:10px;background:var(--run)}
.t-test{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.t-test.fail{width:9px;height:9px;border-radius:0;background:transparent;position:relative}
.t-test.fail::before,.t-test.fail::after{content:"";position:absolute;left:3.5px;top:-.5px;width:2px;height:10px;border-radius:1px;background:var(--bad);transform:rotate(45deg)}
.t-test.fail::after{transform:rotate(-45deg)}
.t-test.live{background:transparent;border:2px solid var(--act)}
.strip:focus-visible{outline-offset:0}
.lrh .btn.sm{flex:none}
.db+.dn,.pips+.tn{margin-left:6px}
/* row actions stay in the tab order (opacity, not visibility), so Shift+Tab reaches them too */
.lra{display:flex;justify-content:flex-end;align-items:center;gap:6px;min-width:150px;flex:none;opacity:0;pointer-events:none}
.lr:hover .lra,.lr:focus-within .lra,.lr.cur .lra,.lr.open .lra,.lr.edit .lra,.lr.act .lra{opacity:1;pointer-events:auto}
@media (hover:none){.lra{opacity:1;pointer-events:auto}}
</style>
<style>
/* ---------- Module card (level 2) + evidence (level 3) ---------- */
.work{padding:16px 20px calc(var(--mock-h,56px) + 48px)}
.card{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--card);border:1px solid var(--hair-2);border-radius:8px;overflow:hidden}
.card.noev{grid-template-columns:minmax(0,1fr)}
.card.sum{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.cm{padding:16px 20px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ce{border-left:1px solid var(--hair-2);min-width:0;display:flex;flex-direction:column}
.ch{display:flex;align-items:center;gap:8px 10px;min-width:0;flex-wrap:wrap}
.ch h2{margin:0;outline-offset:2px;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.cid{font-family:var(--font-mono);font-size:14px;font-weight:500;color:var(--muted-fg)}
.ch .tools{display:flex;align-items:center;gap:6px;margin-left:auto}
.rpl{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:999px;border:1px dashed var(--bad);flex:none}
.cbody{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.card.noev .cbody{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 40px}
.card.noev .cbody.solo{grid-template-columns:minmax(0,1fr)}
.cl{display:flex;flex-direction:column;gap:14px;min-width:0}
.goal{margin:0;display:flex;gap:8px;color:var(--fg-2);align-items:center}
.goal .i{color:var(--muted-fg)}
.lab{font-size:12px;color:var(--muted-fg);font-weight:500;letter-spacing:.02em;margin:0 0 6px;display:flex;align-items:center;gap:6px}
.crit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.crit li{display:flex;align-items:center;gap:8px;min-height:26px}
.crit .src{margin-left:auto;display:flex;gap:4px;align-items:center}
.src .sx{display:inline-flex;align-items:center;gap:2px;height:22px;padding:0 5px;border-radius:4px;background:var(--muted)}
.src .sx.ok{color:var(--ok-fg)} .src .sx.say{color:var(--warn-fg)}
.src .sx .i{stroke-width:2}
.facts{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px 24px;align-content:start}
.facts>div{min-width:0}
.frow{display:flex;align-items:center;gap:8px;min-height:28px;border-radius:4px;padding:2px 6px;margin:0 -6px;width:calc(100% + 12px);min-width:0}
button.frow{transition:background-color .15s}
button.frow:hover{background:var(--muted)}
button.frow[aria-disabled="true"],.chip.lnk[aria-disabled="true"],.vchip[aria-disabled="true"]{cursor:default}
button.frow[aria-disabled="true"]:hover{background:none}
.frow .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.flagbar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;background:var(--warn-soft);border:1px solid var(--warn)}
.flagbar .i{color:var(--warn-fg)}
.cf{display:flex;gap:8px;align-items:center;margin-top:auto}
.vchip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:999px;border:1px solid var(--control-border);color:var(--fg-2);font-family:var(--font-mono);font-size:12px;cursor:pointer;transition:background-color .15s}
.vchip:hover{background:var(--muted)}
.vchip.you{border-color:var(--act);color:var(--act-fg)}
.empty{display:flex;align-items:center;gap:8px;color:var(--muted-fg);font-size:12px;min-height:28px}
.ed{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--hair-2);border-radius:8px;background:var(--bg)}
.ed .row{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.tabs{display:flex;gap:2px;padding:8px 10px;border-bottom:1px solid var(--hair)}
.tab{height:32px;padding:0 10px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;color:var(--muted-fg);font-size:12px;transition:background-color .15s,color .15s}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{background:var(--muted);color:var(--fg);box-shadow:inset 0 0 0 1px var(--control-border)}
.fh{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 4px;border-radius:6px;color:var(--fg-2)}
.evb{padding:8px 10px 12px;overflow:auto;max-height:460px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.step{width:100%;display:grid;grid-template-columns:18px minmax(0,1fr) auto 38px;align-items:center;gap:10px;min-height:34px;padding:4px 8px;border-radius:6px;transition:background-color .15s}
.step:hover{background:var(--muted)}
.step[aria-expanded="true"]{background:var(--muted)}
.step .tg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono);font-size:12px;color:var(--fg)}
.step .tm{color:var(--muted-fg);text-align:right;font-family:var(--font-mono);font-size:12px}
.step .ic{color:var(--muted-fg)}
.step.fail .ic{color:var(--bad-fg)}
.step.you .ic{color:var(--act-fg)}
.step.you .tg{font-family:var(--font-ui);color:var(--fg-2)}
.det{margin:4px 0 8px 28px;border:1px solid var(--hair);border-radius:6px;overflow:hidden;background:var(--bg)}
.det .dh{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--hair);font-family:var(--font-mono);font-size:12px;color:var(--fg-2)}
.code{margin:0;font:12px/1.6 var(--font-mono);overflow-x:auto;padding:4px 0}
.code div{white-space:pre;padding:0 10px;min-height:19px}
.code .a{background:var(--add-bg);color:var(--add-fg)}
.code .d{background:var(--del-bg);color:var(--del-fg)}
.code .h{color:var(--muted-fg)}
.code .c{color:var(--fg-2)}
.code .hi{background:var(--warn-soft);color:var(--fg)}
.code .f{color:var(--bad-fg)}
.code .o{color:var(--ok-fg)}
.vers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.vers li{border:1px solid var(--hair);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.vers li.cur{border-color:var(--hair-2);background:var(--muted)}
.vers .vh2{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted-fg)}
.sumfoot{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.redo{display:flex;flex-direction:column;gap:10px;padding:14px 16px 16px}
.redo-h{display:flex;align-items:center;gap:8px}
.redo-h h3{margin:0;font-size:16px;font-weight:600}
.redo-h .i{color:var(--bad-fg)}
.cq{list-style:none;margin:0;padding:10px 12px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--hair-2);border-radius:8px;background:var(--bg)}
.cq li{display:grid;grid-template-columns:24px 64px minmax(0,1fr);align-items:center;gap:8px;min-height:26px}
/* rewind strip: kept modules | cut | replaced attempts (one graphic for the conversation rewind) */
.rw{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rwcut{display:inline-grid;place-items:center;width:22px;height:26px;color:var(--bad-fg);border-left:2px dashed var(--bad);margin-left:4px}
.cq .k{font-size:12px;color:var(--muted-fg)}
.cq .ci{color:var(--fg-2)}
.cq .ci.bad{color:var(--bad-fg)}
.rst{display:inline-flex;align-items:center;gap:4px}
.rst .i:last-child{color:var(--act-fg)}
.redo .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- Log view (baseline) ---------- */
.log{padding:14px 20px calc(var(--mock-h,56px) + 48px)}
.ltools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.fgrp{display:flex;gap:2px;padding:2px;border:1px solid var(--hair-2);border-radius:8px;flex-wrap:wrap}
.fc{height:28px;padding:0 9px;border-radius:6px;font-size:12px;color:var(--muted-fg);display:inline-flex;align-items:center;gap:6px;transition:background-color .15s,color .15s}
.fc:hover{color:var(--fg)}
.fc[aria-pressed="true"],.fc[aria-checked="true"]{background:var(--muted);color:var(--fg);box-shadow:inset 0 0 0 1px var(--control-border)}
.search{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--control-border);border-radius:6px;margin-left:auto;min-width:200px;color:var(--muted-fg);background:var(--card)}
.search input{background:none;border:0;color:var(--fg);outline:none;width:100%;min-width:0}
.search input::placeholder{color:var(--muted-fg)}
.search:focus-within{outline:2px solid var(--focus);outline-offset:1px}
.ll{list-style:none;margin:0;padding:0;border:1px solid var(--hair-2);border-radius:8px;background:var(--card);overflow:hidden}
.lr{border-top:1px solid var(--hair)}
.lr:first-child{border-top:0}
.lrh{display:flex;align-items:center;gap:8px;padding-right:10px}
.lrb{flex:1;min-width:0;display:grid;grid-template-columns:46px 40px 20px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:40px;padding:4px 12px;transition:background-color .15s}
.lrb:hover{background:var(--muted)}
/* the list clips overflow, so the ring is drawn inside the row */
.lrb:focus-visible{outline-offset:-2px}
.lr.cur .lrb{box-shadow:inset 3px 0 0 var(--act)}
.lr.open .lrb{background:var(--muted)}
/* redo cut: drawn on the Start row that the conversation rewinds to */
.lr.cut{border-top:2px dashed var(--bad)}
.lrb .tm{font-family:var(--font-mono);font-size:12px;color:var(--muted-fg)}
.tag{font-family:var(--font-mono);font-size:12px;color:var(--fg-2);padding:1px 6px;border-radius:4px;background:var(--muted);text-align:center;justify-self:start}
.lrb .sm2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrb .ic{color:var(--muted-fg)}
.lrb .bdg{display:flex;gap:8px;align-items:center}
.lr .lflag{color:var(--warn-fg)}
.lrd{padding:2px 12px 12px 118px;display:flex;flex-direction:column;gap:8px}
.lrd .det{margin:0}
.lrd .plan{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.lrd .plan .ph{display:flex;align-items:center;gap:8px;min-height:26px}
.lrd .plan .pi{padding-left:14px;color:var(--muted-fg);font-size:12px}
.lrd .plan .pg{padding-left:14px;font-size:12px;color:var(--fg-2);display:flex;flex-direction:column;gap:2px}
.lrd .plan .pg span{display:flex;align-items:center;gap:6px}
.pb{width:6px;height:6px;border-radius:1px;background:var(--pend-line);display:block;flex:none}
.lred{padding:4px 12px 14px 118px}
.lred .redo{padding:12px;border:1px solid var(--hair-2);border-radius:8px;background:var(--bg)}
.lred .cq{background:var(--card)}
.lempty{padding:18px;color:var(--muted-fg);display:flex;gap:8px;align-items:center}

/* ---------- Mockup chrome (not product) ---------- */
.mock{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 24px);padding:5px 6px;border-radius:999px;background:var(--mock-bg);color:var(--mock-fg);box-shadow:var(--shadow);font-size:12px;border:1px dashed var(--mock-fg)}
.mock-tag{font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:0 8px 0 10px;font-size:11px}
.mg{display:flex;gap:2px;background:var(--mock-sub);border-radius:999px;padding:2px}
.mb{height:28px;padding:0 10px;border-radius:999px;color:inherit;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mb:hover{background:var(--mock-sub)}
.mb[aria-pressed="true"]{background:var(--mock-fg);color:var(--mock-bg)}
.mb .kb{font-family:var(--font-mono);font-size:11px;opacity:.8}
.mock :focus-visible{outline-color:var(--mock-fg)}

/* ---------- Motion + responsive ---------- */
@media (prefers-reduced-motion:reduce){
  .train i,.spin{animation:none!important}
  *{transition:none!important}
}
@media (max-width:1100px){
  .card.noev .cbody{grid-template-columns:minmax(0,1fr)}
  .card.sum{grid-template-columns:minmax(0,1fr)}
  .card.sum .ce{border-left:0;border-top:1px solid var(--hair-2)}
}
@media (max-width:900px){
  .card,.card.sum{grid-template-columns:minmax(0,1fr)}
  .ce{border-left:0;border-top:1px solid var(--hair-2)}
  .facts{grid-template-columns:minmax(0,1fr)}
  .ch{flex-wrap:wrap}
}
@media (max-width:768px){
  .now{padding:10px 16px;gap:10px}
  .now-title{max-width:calc(100vw - 120px)}
  .work,.log{padding-left:16px;padding-right:16px;padding-bottom:calc(var(--mock-h,140px) + 40px)}
  .metro{padding:40px 16px 10px}
  .st-ev,.st-lab .nm{display:none}
  .lrb{grid-template-columns:40px 36px 18px minmax(0,1fr)}
  .lrb .bdg{grid-column:4}
  .lrb .bdg:empty{display:none}
  /* narrow: actions wrap under the row and only open for the current/open/focused row, so summaries keep their width.
     Collapsed (zero height), never display:none, so both Tab and Shift+Tab still reach them and :focus-within opens them. */
  .lrh{flex-wrap:wrap;row-gap:0}
  .lra{display:flex;min-width:0;width:100%;justify-content:flex-start;max-height:0;overflow:hidden;opacity:0;pointer-events:none;padding:0 12px 0 98px}
  .lr.act .lra,.lr.cur .lra,.lr.open .lra,.lr.edit .lra,.lr:focus-within .lra{max-height:none;overflow:visible;opacity:1;pointer-events:auto;padding-top:8px;padding-bottom:8px}
  .lra:empty{display:none}
  .pop{position:fixed;left:16px;right:16px;width:auto;top:calc(var(--now-h,64px) + 8px)}
  .train{width:26px}
  .train i{width:20px;animation:none}
  .train i::before{left:4px}.train i::after{left:12px}
  .lrd,.lred{padding-left:12px}
  .search{margin-left:0;flex:1}
  .cq li{grid-template-columns:24px minmax(0,1fr)}
  .cq .k{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
  .mock{border-radius:14px;bottom:8px}
  .mg{flex-wrap:wrap;justify-content:center;border-radius:12px}
}
</style>
</head>

/* =====================================================================
   LEVEL 1 · METRO LINE (modular view)
   ===================================================================== */
function relSet(sel) {
  if (!sel || sel === 'pre') return null;
  const r = new Set([sel]);
  EDGES.forEach(e => { if (e[0] === sel) r.add(e[1]); if (e[1] === sel) r.add(e[0]); });
  return r;
}
function renderMetro() {
  const rel = relSet(S.sel), k = redoTarget();
  let h = `<section class="metro" id="metro" aria-label="Plan">
    <svg class="metro-svg" id="metroSvg" aria-hidden="true"></svg>
    <div class="stations" id="stations" role="group" aria-label="Plan: before plan and ${MODS.length} modules. Use j and k to move.">`;
  ['pre'].concat(MODS).forEach(id => {
    if (k && id === k) h += cutHTML(k);
    h += beforeStationHTML(id, k) + stationHTML(id, rel) + afterStationHTML(id);
  });
  return h + '</div></section>';
}
/* markers live in DOM order where they sit on the line, so Tab follows the line */
function beforeStationHTML(id, k) {
  /* the train docks on the incoming side of the working station */
  if (statusOf(id) === 'working' && !k) return `<span class="mk train" data-at="tr:${id}" ${tipImg('Agent is working in ' + id)}><i></i></span>`;
  return '';
}
function afterStationHTML(id) {
  let m = '';
  if (id === 'M3' && isWaiting()) m += `<span class="mk held" data-at="b:M3" ${tipImg('Agent is held after M3, waiting for you', 'Agent is held here, waiting for you')}>${glyph('waiting', 18)}</span>`;
  if (pauseOptions().indexOf(id) >= 0) {
    const on = S.pauseAt === id;
    const tipTxt = on ? `Pause armed: agent will wait after ${id}. Click to remove` : `Pause after ${id}`;
    const body = on ? octagon(24, true) : `<span class="o-on">${octagon(20, false)}</span>`;
    m += `<button class="mk ${on ? 'on' : 'bnd'}" data-at="b:${id}" data-a="bnd" data-v="${id}" data-k="bnd-${id}" aria-pressed="${on}" aria-label="Pause after ${id}" data-tip="${tipTxt}">${body}</button>`;
  }
  return m;
}
function cutHTML(k) {
  return `<span class="cutline" data-at="c:${k}" aria-hidden="true"></span>` +
    `<span class="mk cutmk" data-at="c:${k}" ${tipImg('Redo rewinds to here, before ' + k, 'Redo rewinds to here (before ' + k + ')')}>${ic('cut', 14)}</span>`;
}
function stationHTML(id, rel) {
  const m = mod(id), s = shownStatus(id), cur = S.sel === id;
  const cls = rel ? (rel.has(id) ? ' rel' : ' dim') : '';
  let ev = '', lab, tip, desc;
  if (id === 'pre') {
    lab = ic('eye', 14);
    /* same tick vocabulary as the activity strip, so one legend covers both */
    ev = strip(DATA.pre.actions);

    desc = 'Read 3 files, ran 1 command';
  } else {

    /* ONE compact evidence graphic per station: the latest tests as pips */

    desc = [evidenceText(m), depsText(id)].filter(Boolean).join(' · ');

  return `<button class="st${cls}" data-a="sel" data-v="${id}" data-id="${id}" data-k="st-${id}" aria-current="${cur}" aria-label="${esc(aria)}" aria-describedby="ev-${id}" data-tip="${esc(tip)}">

function drawMetro() {
  const metro = $('#metro');
  if (!metro) return;
  const svg = $('#metroSvg'), stn = $('#stations');
  const mr = metro.getBoundingClientRect(), sr = stn.getBoundingClientRect();
  const P = {};
  $$('.st', metro).forEach(b => {
    const d = $('.st-dot', b).getBoundingClientRect();
    P[b.dataset.id] = { x: d.left - mr.left + d.width / 2, y: d.top - mr.top + d.height / 2, r: d.width / 2 };
  });
  const y = P.M1.y, W = mr.width;
  svg.setAttribute('width', W); svg.setAttribute('height', mr.height);
  svg.setAttribute('viewBox', `0 0 ${W} ${mr.height}`);
  const sel = S.sel, k = redoTarget(), ki = k ? MODS.indexOf(k) : 99, rel = relSet(sel);
  const gap = P.M2.x - P.M1.x;
  const endX = Math.min(P.M4.x + gap * 0.42, W - 14);
  const bx = id => id === 'M4' ? endX : (P[id].x + P[MODS[MODS.indexOf(id) + 1]].x) / 2;
  let h = `<line class="ln pre" x1="${P.pre.x}" y1="${y}" x2="${P.M1.x}" y2="${y}"/>`;
  h += `<line class="ln ${S.state >= 3 ? 'done' : 'future'}${k ? ' gone' : ''}" x1="${P.M4.x}" y1="${y}" x2="${endX}" y2="${y}"/>`;
  EDGES.forEach(e => {
    const a = e[0], b = e[1], ia = MODS.indexOf(a), ib = MODS.indexOf(b), adj = ib - ia === 1;
    let cls = statusOf(b) !== 'pending' ? 'done' : 'future';
    /* highlighted = both ends in the selection's related set; arrowheads only on the selection's own edges */
    const hl = !!rel && rel.has(a) && rel.has(b);
    const own = !!sel && (a === sel || b === sel);
    const dim = !!rel && !hl;
    let d, ax, ay;
    if (adj) { d = `M${P[a].x} ${y} L${P[b].x} ${y}`; ax = P[a].x + (P[b].x - P[a].x) * 0.3; ay = y; }
    else {
      const x1 = P[a].x, x2 = P[b].x, dx = x2 - x1, H = 38;
      d = `M${x1} ${y} C${x1 + dx * 0.18} ${y - H} ${x2 - dx * 0.18} ${y - H} ${x2} ${y}`;
      ax = (x1 + x2) / 2; ay = y - H * 0.75;
    }
    if (k && ib >= ki) {
      if (adj && ia === ki - 1) {
        const mx = (P[a].x + P[b].x) / 2;
        h += `<path class="ln done" d="M${P[a].x} ${y} L${mx} ${y}"/>`;
        d = `M${mx} ${y} L${P[b].x} ${y}`;
      }
      cls = 'gone';
    }
    h += `<path class="ln ${cls}${hl ? ' hl' : ''}${dim ? ' dimln' : ''}" d="${d}"/>`;
    if (own && hl) h += `<path class="arw" d="M${ax - 3.5} ${ay - 4.5} L${ax + 2.5} ${ay} L${ax - 3.5} ${ay + 4.5}"/>`;
  });
  if (S.state >= 3 && !k) h += `<line class="ln term" x1="${endX}" y1="${y - 9}" x2="${endX}" y2="${y + 9}"/>`;
  svg.innerHTML = h;

  /* place the in-flow markers (train, held diamond, stop signs, redo cut) on the line */
  const ox = sr.left - mr.left, oy = sr.top - mr.top;
  $$('[data-at]', stn).forEach(el => {
    const p = el.dataset.at.split(':'), id = p[1];
    let x = P[id].x, yy = y;
    if (p[0] === 'b') x = bx(id);
    else if (p[0] === 'tr') { const w = el.firstElementChild ? el.firstElementChild.offsetWidth : 28; x = P[id].x - P[id].r - 3 - w / 2; }
    else if (p[0] === 'c') {
      const i = MODS.indexOf(id); x = (P[i === 0 ? 'pre' : MODS[i - 1]].x + P[id].x) / 2;
      /* the scissors ride above the track, clear of the arrowheads and the selection ring */
      if (el.classList.contains('cutmk')) yy = y - 40;
    }
    el.style.left = (x - ox) + 'px';
    el.style.top = (yy - oy) + 'px';
  });
}

/* =====================================================================

/* ---------- evidence column ---------- */

function emptyEv() { return `<div class="empty">${glyph('pending', 14)}<span>Not started</span></div>`; }

    E.push({ id: 's-' + id, t: m.start, mod: id, type: 'module', icon: 'playc', text: `Start ${id} · ${m.title}`, m: id, kind: 'start' });
    m.actions.forEach((a, i) => E.push(actEv(a, id, id + '-a' + i)));
    if (m.status === 'verified' || m.status === 'unverified') E.push({ id: 'f-' + id, t: m.end, mod: id, type: 'module', glyph: m.status, text: `Finish ${id} · ${m.status === 'verified' ? 'verified' : 'unverified'}`, m: id, kind: 'finish', flag: m.flag });
  });
  if (st >= 2) E.push({ id: 'hold', t: '3:40', mod: 'run', type: 'run', glyph: 'waiting', text: isWaiting() ? 'Held before M4 · waiting for you' : 'Held before M4' });
  if (st >= 3) E.push({ id: 'cont', t: '4:26', pri: -0.5, mod: 'run', type: 'user', icon: 'user', text: 'Continued by you' });
  if (st >= 3) E.push({ id: 'run1', t: '6:00', mod: 'run', type: 'run', glyph: 'end', text: 'Run finished · 4 modules · 1 flag' });
  /* your interventions (instruction versions, corrections, notes, pauses) in the order you made them */
  const U = S.ulog.slice();
  MODS.forEach(id => S.versions[id].forEach(v => { if (v.by === 'you') U.push({ id: 'v-' + id + '-' + v.v, seq: v.seq, t: v.t, mod: id, type: 'plan', icon: 'user', text: `${id} instructions v${v.v} · by you`, ver: id }); }));
  U.sort((a, b) => a.seq - b.seq).forEach(u => E.push(u));
  /* stable sort keeps same-time events in the order they were pushed */
  const key = e => sec(e.t) + (e.pri || 0);

document.addEventListener('focusout', e => {

  const ctl = e.target.closest && e.target.closest('.ctl'), to = e.relatedTarget;
  if (!ctl || !to || ctl.contains(to) || !ctl.querySelector('.pop')) return;
  S.pop = null;
  ctl.querySelector('.pop').remove();
  const trig = ctl.querySelector('[aria-expanded="true"]');
  if (trig) trig.setAttribute('aria-expanded', 'false');
});
document.addEventListener('keydown', e => {
  const t = e.target && e.target.closest ? e.target : document.body;
  if (S.pop === 'stop' && e.key === 'Tab') {
    const f = $$('#now .pop button');
    if (!f.length) return;
    e.preventDefault();
    const i = f.indexOf(document.activeElement);
    f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
    return;
  }
  const typing = t.matches('input, textarea');
  if (e.key === 'Escape') {
    if (typing && t.id === 'q' && t.value) return;
    if (escapeLevel(t)) e.preventDefault(); else hideTip();
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  const role = t.getAttribute('role');
  if (role === 'tab' && /^(ArrowRight|ArrowLeft|Home|End)$/.test(e.key)) {
    const tabs = $$('[role="tab"]', t.parentNode), i = tabs.indexOf(t);
    const n = e.key === 'Home' ? tabs[0] : e.key === 'End' ? tabs[tabs.length - 1] : tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
    if (n) { e.preventDefault(); S.evTab = n.dataset.v; S.focus = n.dataset.k; render(); }
    return;
  }
  /* log filter radiogroups: roving tabindex, arrows move + select */
  if (role === 'radio' && /^Arrow(Right|Left|Down|Up)$/.test(e.key)) {
    const rs = $$('[role="radio"]', t.closest('[role="radiogroup"]')), i = rs.indexOf(t);
    const d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : -1;
    const n = rs[(i + d + rs.length) % rs.length];
    if (n) { e.preventDefault(); n.click(); }
    return;
  }
  if (t.closest('.pop')) return;
  /* product shortcuts j/k/Enter only act while the plan, the card or the log list has focus (WCAG 2.1.4) */
  const scoped = !t.closest('#now, #mock, .redo, .ed') && !!t.closest('#stations, .card, #logList');
  switch (e.key) {
    case 'j': case 'J': if (scoped) { e.preventDefault(); move(1, t); } break;
    case 'k': case 'K': if (scoped) { e.preventDefault(); move(-1, t); } break;
    case 'Enter': if (scoped && (t.id === 'cardT' || t.id === 'logList')) { e.preventDefault(); openLevel(); } break;
    /* mockup chrome only */
    case '1': case '2': case '3': case '4': setState(+e.key); break;
    case 'v': switchView(S.view === 'modules' ? 'log' : 'modules', null); break;
    case 't': S.theme = S.theme === 'dark' ? 'light' : 'dark'; render(); break;
  }
});
let rz = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { setBarVars(); if (S.view === 'modules') drawMetro(); }); });
if (window.ResizeObserver) { const ro = new ResizeObserver(() => setBarVars()); ro.observe($('#now')); ro.observe($('#mock')); }
setInterval(() => {
  if (!isWaiting()) return;
  S.wait++;
  const el = $('#waitT'), p = $('#waitP');
  if (el) el.textContent = fmt(S.wait);
  if (p) p.setAttribute('aria-label', 'Waiting for you for ' + fmt(S.wait));
}, 1000);

render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { setBarVars(); if (S.view === 'modules') drawMetro(); });
})();
</script>
